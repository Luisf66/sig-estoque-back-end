0 });\n\n    // Assert: Verifica se o estoque foi atualizado corretamente\n    const updatedProduct = await productsRepository.findById(createdProduct.id);\n    expect(updatedProduct?.quantity_in_stock).toEqual(80);\n  });\n\n  it('should throw an error if the product is not found', async () => {\n    // Act & Assert: Tenta reduzir o estoque de um produto inexistente e espera um erro\n    await expect(() =>\n      sut.execute({ productId: 'non-existing-id', quantity: 10 })\n    ).rejects.toBeInstanceOf(ResourceNotFoundError);\n  });\n\n  it('should throw an error if there is insufficient stock', async () => {\n    // Arrange: Cria um produto com estoque baixo\n    const createdProduct = await productsRepository.create({\n      name: 'Potenciômetro',\n      description: 'Resistor variável',\n      price: 2.50,\n      quantity_in_stock: 5,\n      batch: 'P1'\n    });\n\n    // Act & Assert: Tenta reduzir mais do que o estoque disponível e espera um erro\n    await expect(() =>\n      sut.execute({ productId: createdProduct.id, quantity: 10 })\n    ).rejects.toThrow('Insufficient stock');\n  });\n\n  it('should throw an error if product stock information is missing', async () => {\n    // Arrange: Cria um produto com estoque nulo\n    const createdProduct = await productsRepository.create({\n      name: 'Protoboard',\n      description: 'Placa de ensaio',\n      price: 15.00,\n      quantity_in_stock: null, // Estoque nulo\n      batch: 'PB1'\n    });\n\n    // Act & Assert: Tenta reduzir o estoque e espera um erro\n    await expect(() =>\n      sut.execute({ productId: createdProduct.id, quantity: 1 })\n    ).rejects.toThrow('Product stock information is missing');\n  });\n});\n"},"src/services/sale/fetch-all-sale-by-user-id.test.ts":{"tests":[{"id":"224","name":"Fetch All Sale By User Id Service should be able to fetch all sales by user id"},{"id":"225","name":"Fetch All Sale By User Id Service should return an empty array when the user has no sales"},{"id":"226","name":"Fetch All Sale By User Id Service should throw an error if the user is not found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemorySaleRepository } from '../../repositories/in-memory/in-memory-sale-repository';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\nimport { FetchAllSaleByUserIdService } from './fetch-all-sale-by-user-id';\nimport { ResourceNotFoundError } from '../errors/resource-not-found-error';\n\n// Declaração das variáveis\nlet saleRepository: InMemorySaleRepository;\nlet usersRepository: InMemoryUsersRepository;\nlet sut: FetchAllSaleByUserIdService; // SUT: System Under Test\n\ndescribe('Fetch All Sale By User Id Service', () => {\n  beforeEach(() => {\n    // Instancia os repositórios e o serviço antes de cada teste\n    saleRepository = new InMemorySaleRepository();\n    usersRepository = new InMemoryUsersRepository();\n    sut = new FetchAllSaleByUserIdService(saleRepository, usersRepository);\n  });\n\n  it('should be able to fetch all sales by user id', async () => {\n    // Arrange: Cria um usuário e duas vendas associadas a ele\n    const user = await usersRepository.create({\n      id: 'user-01',\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'hashed_password'\n    });\n\n    await saleRepository.create({\n      nf_number: 'NF-SALE-01',\n      user: { connect: { id: user.id } },\n    });\n\n    await saleRepository.create({\n      nf_number: 'NF-SALE-02',\n      user: { connect: { id: user.id } },\n    });\n\n    // Cria outra venda para outro usuário para garantir que não seja retornada\n    await saleRepository.create({\n      nf_number: 'NF-SALE-03',\n      user: { connect: { id: 'user-02' } },\n    });\n\n    // Act: Executa o serviço\n    const { sales } = await sut.execute({ userId: user.id });\n\n    // Assert: Verifica se apenas as vendas do usuário correto foram retornadas\n    expect(sales).toHaveLength(2);\n    expect(sales[0].nf_number).toEqual('NF-SALE-01');\n    expect(sales[1].nf_number).toEqual('NF-SALE-02');\n  });\n\n  it('should return an empty array when the user has no sales', async () => {\n    // Arrange: Cria um usuário sem vendas associadas\n    const user = await usersRepository.create({\n      id: 'user-01',\n      name: 'Jane Doe',\n      email: 'jane.doe@example.com',\n      password_hash: 'hashed_password'\n    });\n\n    // Act: Executa o serviço\n    const { sales } = await sut.execute({ userId: user.id });\n\n    // Assert: Verifica se um array vazio é retornado\n    expect(sales).toHaveLength(0);\n  });\n\n  it('should throw an error if the user is not found', async () => {\n    // Act & Assert: Tenta buscar vendas de um usuário inexistente e espera um erro\n    await expect(() =>\n      sut.execute({ userId: 'non-existing-user-id' })\n    ).rejects.toBeInstanceOf(ResourceNotFoundError);\n  });\n});\n"},"src/services/employee/create-employee.test.ts":{"tests":[{"id":"227","name":"Create Employee Service should be able to create a new employee"},{"id":"228","name":"Create Employee Service should hash the user password upon creation"},{"id":"229","name":"Create Employee Service should not be able to create an employee with an existing email"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryEmployeesRepository } from '../../repositories/in-memory/in-memory-employee-repository';\nimport { CreateEmployeeService } from './create-employee';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\n\n// Declaração das variáveis para serem acessíveis em todos os testes do bloco\nlet employeesRepository: InMemoryEmployeesRepository;\nlet usersRepository: InMemoryUsersRepository;\nlet sut: CreateEmployeeService; // SUT: System Under Test\n\ndescribe('Create Employee Service', () => {\n  beforeEach(() => {\n    // Para cada teste, criamos novas instâncias dos repositórios e do service.\n    // Isso garante que um teste não interfira no outro.\n    employeesRepository = new InMemoryEmployeesRepository();\n    usersRepository = new InMemoryUsersRepository();\n    sut = new CreateEmployeeService(employeesRepository, usersRepository);\n  });\n\n  it('should be able to create a new employee', async () => {\n    // Act: Executa o método principal do service\n    const { employee } = await sut.execute({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password: 'password123',\n    });\n\n    // Assert: Verifica se o resultado é o esperado\n    expect(employee.id).toEqual(expect.any(String));\n    // Verifica se o usuário e o funcionário foram criados nos repositórios\n    expect(usersRepository.items).toHaveLength(1);\n    expect(employeesRepository.items).toHaveLength(1);\n    expect(usersRepository.items[0].email).toEqual('john.doe@example.com');\n  });\n\n  it('should hash the user password upon creation', async () => {\n    // Act\n    await sut.execute({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password: 'password123',\n    });\n\n    // Assert\n    const createdUser = usersRepository.items[0];\n    // Verifica que a senha armazenada no usuário não é a senha em texto plano\n    expect(createdUser.password_hash).not.toEqual('password123');\n  });\n\n  it('should not be able to create an employee with an existing email', async () => {\n    // Arrange: Primeiro, cria um usuário com um e-mail específico.\n    await usersRepository.create({\n      name: 'Jane Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'hashed_password_123'\n    });\n\n    // Act & Assert: Tenta criar um funcionário com o mesmo e-mail\n    // e espera que o método rejeite a promessa com o erro correto.\n    await expect(() =>\n      sut.execute({\n        name: 'John Doe',\n        email: 'john.doe@example.com',\n        password: 'password456',\n      })\n    ).rejects.toThrow(new Error(\"Email already exists.\"));\n  });\n});"},"src/services/product/patch-product.test.ts":{"tests":[{"id":"230","name":"Patch Product Service should be able to patch a product"},{"id":"231","name":"Patch Product Service should throw an error if the product to patch is not found"},{"id":"232","name":"Patch Product Service should throw an error if trying to patch an inactive product"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryProductsRepository } from '../../repositories/in-memory/in-memory-products-repository';\nimport { PatchProductService } from './patch-product';\nimport { ResourceNotFoundError } from '../errors/resource-not-found-error';\nimport { InactiveError } from '../errors/inactive-error';\n\n// Declaração das variáveis\nlet productsRepository: InMemoryProductsRepository;\nlet sut: PatchProductService; // SUT: System Under Test\n\ndescribe('Patch Product Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    productsRepository = new InMemoryProductsRepository();\n    sut = new PatchProductService(productsRepository);\n  });\n\n  it('should be able to patch a product', async () => {\n    // Arrange: Cria um produto para ser atualizado\n    const createdProduct = await productsRepository.create({\n      name: 'Resistor 10k',\n      description: 'Resistor de filme de carbono',\n      price: 0.10,\n      quantity_in_stock: 1000,\n      batch: 'R1'\n    });\n\n    // Act: Executa o serviço com novos dados parciais\n    const { product } = await sut.handle({\n      id: createdProduct.id,\n      data: {\n        name: 'Resistor 10k Ohm',\n        price: 0.12,\n      }\n    });\n\n    // Assert: Verifica se os campos foram atualizados e outros permaneceram iguais\n    expect(product?.name).toEqual('Resistor 10k Ohm');\n    expect(product?.price).toEqual(0.12);\n    expect(product?.description).toEqual('Resistor de filme de carbono'); // Deve permanecer o mesmo\n  });\n\n  it('should throw an error if the product to patch is not found', async () => {\n    // Act & Assert: Tenta atualizar um produto com um ID inexistente e espera um erro\n    await expect(() =>\n      sut.handle({\n        id: 'non-existing-id',\n        data: { name: 'New Name' }\n      })\n    ).rejects.toBeInstanceOf(ResourceNotFoundError);\n  });\n\n  it('should throw an error if trying to patch an inactive product', async () => {\n    // Arrange: Cria um produto e o inativa\n    const createdProduct = await productsRepository.create({\n      name: 'Old Transistor',\n      description: 'An old model',\n      price: 0.50,\n      quantity_in_stock: 20,\n      batch: 'T2'\n    });\n\n    await productsRepository.inactivate(createdProduct.id);\n\n    // Act & Assert: Tenta atualizar o produto inativo e espera um erro específico\n    await expect(() =>\n      sut.handle({\n        id: createdProduct.id,\n        data: { price: 0.45 }\n      })\n    ).rejects.toBeInstanceOf(InactiveError);\n  });\n});\n"},"src/services/manager/create-manager.test.ts":{"tests":[{"id":"233","name":"Create Manager Service should be able to create a new manager"},{"id":"234","name":"Create Manager Service should hash the user password upon creation"},{"id":"235","name":"Create Manager Service should not be able to create a manager with an existing email"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryManagersRepository } from '../../repositories/in-memory/in-memory-manager-repository';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\nimport { CreateManagerService } from './create-manager';\nimport { UserAlreadyExistsError } from '../errors/user-already-exists-error';\n\n// Declaração das variáveis\nlet managersRepository: InMemoryManagersRepository;\nlet usersRepository: InMemoryUsersRepository;\nlet sut: CreateManagerService; // SUT: System Under Test\n\ndescribe('Create Manager Service', () => {\n  beforeEach(() => {\n    // Instancia os repositórios e o serviço antes de cada teste\n    managersRepository = new InMemoryManagersRepository();\n    usersRepository = new InMemoryUsersRepository();\n    sut = new CreateManagerService(managersRepository, usersRepository);\n  });\n\n  it('should be able to create a new manager', async () => {\n    // Act: Executa o serviço para criar um novo gerente\n    const { manager } = await sut.execute({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password: 'password123',\n    });\n\n    // Assert: Verifica se o gerente foi criado com um ID\n    expect(manager.id).toEqual(expect.any(String));\n    // Verifica se o usuário correspondente foi criado com o e-mail e role corretos\n    const user = await usersRepository.findByEmail('john.doe@example.com');\n    expect(user?.role).toEqual('MANAGER');\n  });\n\n  it('should hash the user password upon creation', async () => {\n    // Act\n    await sut.execute({\n      name: 'Jane Doe',\n      email: 'jane.doe@example.com',\n      password: 'password123',\n    });\n\n    // Assert\n    const user = await usersRepository.findByEmail('jane.doe@example.com');\n    // Verifica se a senha armazenada é diferente da senha em texto plano\n    expect(user?.password_hash).not.toEqual('password123');\n  });\n\n  it('should not be able to create a manager with an existing email', async () => {\n    // Arrange: Cria um usuário com um e-mail específico\n    await usersRepository.create({\n        name: 'Existing User',\n        email: 'duplicate@example.com',\n        password_hash: 'hashed_password'\n    });\n\n    // Act & Assert: Tenta criar um gerente com o mesmo e-mail e espera um erro\n    await expect(() =>\n      sut.execute({\n        name: 'New Manager',\n        email: 'duplicate@example.com',\n        password: 'password456',\n      })\n    ).rejects.toBeInstanceOf(UserAlreadyExistsError);\n  });\n});\n"},"src/services/supplier/fetch-many-supplier-by-social-name.test.ts":{"tests":[{"id":"236","name":"Fetch Many Supplier by Social Name Service should be able to fetch suppliers by social name"},{"id":"237","name":"Fetch Many Supplier by Social Name Service should throw an error if no suppliers are found with the given social name"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemorySuppliersRepository } from '../../repositories/in-memory/in-memory-supplier-repository';\nimport { FetchManySupplierBySocialNameService } from './fetch-many-supplier-by-social-name';\nimport { NoRecordsFoundError } from '../errors/no-records-found-error';\n\n// Declaração das variáveis\nlet suppliersRepository: InMemorySuppliersRepository;\nlet sut: FetchManySupplierBySocialNameService; // SUT: System Under Test\n\ndescribe('Fetch Many Supplier by Social Name Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    suppliersRepository = new InMemorySuppliersRepository();\n    sut = new FetchManySupplierBySocialNameService(suppliersRepository);\n  });\n\n  it('should be able to fetch suppliers by social name', async () => {\n    // Arrange: Cria fornecedores, alguns com a mesma razão social\n    await suppliersRepository.create({\n      social_name: 'Eletrônicos A&B LTDA',\n      company_name: 'Empresa A',\n      phone_number: '11000001111',\n      cnpj: '11.111.111/0001-11',\n    });\n\n    await suppliersRepository.create({\n      social_name: 'Componentes C&D SA',\n      company_name: 'Empresa C',\n      phone_number: '22000002222',\n      cnpj: '22.222.222/0001-22',\n    });\n\n    await suppliersRepository.create({\n      social_name: 'Eletrônicos A&B LTDA',\n      company_name: 'Filial B',\n      phone_number: '33000003333',\n      cnpj: '33.333.333/0001-33',\n    });\n\n    // Act: Executa o serviço buscando por 'Eletrônicos A&B LTDA'\n    const { suppliers } = await sut.execute({ socialName: 'Eletrônicos A&B LTDA' });\n\n    // Assert: Verifica se a lista retornada contém os dois fornecedores corretos\n    expect(suppliers).toHaveLength(2);\n    expect(suppliers[0].company_name).toEqual('Empresa A');\n    expect(suppliers[1].company_name).toEqual('Filial B');\n  });\n\n  it('should throw an error if no suppliers are found with the given social name', async () => {\n    // Arrange\n    await suppliersRepository.create({\n      social_name: 'Fornecedor A LTDA',\n      company_name: 'Tech Corp',\n      phone_number: '11000001111',\n      cnpj: '11.111.111/0001-11',\n    });\n\n    // Act & Assert: Executa o serviço com uma razão social que não existe e espera um erro\n    await expect(() =>\n      sut.execute({ socialName: 'Non-Existent LTDA' })\n    ).rejects.toBeInstanceOf(NoRecordsFoundError);\n  });\n});\n"},"src/services/supplier/fetch-many-supplier-by-company-name.test.ts":{"tests":[{"id":"238","name":"Fetch Many Supplier by Company Name Service should be able to fetch suppliers by company name"},{"id":"239","name":"Fetch Many Supplier by Company Name Service should return an empty array if no suppliers are found with the given company name"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemorySuppliersRepository } from '../../repositories/in-memory/in-memory-supplier-repository';\nimport { FetchManySupplierByCompanyNameService } from './fetch-many-supplier-by-company-name';\n\n// Declaração das variáveis\nlet suppliersRepository: InMemorySuppliersRepository;\nlet sut: FetchManySupplierByCompanyNameService; // SUT: System Under Test\n\ndescribe('Fetch Many Supplier by Company Name Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    suppliersRepository = new InMemorySuppliersRepository();\n    sut = new FetchManySupplierByCompanyNameService(suppliersRepository);\n  });\n\n  it('should be able to fetch suppliers by company name', async () => {\n    // Arrange: Cria fornecedores, alguns com o mesmo nome de empresa\n    await suppliersRepository.create({\n      social_name: 'Fornecedor A LTDA',\n      company_name: 'Tech Corp',\n      phone_number: '11000001111',\n      cnpj: '11.111.111/0001-11',\n    });\n\n    await suppliersRepository.create({\n      social_name: 'Fornecedor B SA',\n      company_name: 'Innovate Solutions',\n      phone_number: '22000002222',\n      cnpj: '22.222.222/0001-22',\n    });\n\n    await suppliersRepository.create({\n      social_name: 'Fornecedor C ME',\n      company_name: 'Tech Corp',\n      phone_number: '33000003333',\n      cnpj: '33.333.333/0001-33',\n    });\n\n    // Act: Executa o serviço buscando por 'Tech Corp'\n    const { supplier } = await sut.execute({ companyName: 'Tech Corp' });\n\n    // Assert: Verifica se a lista retornada contém os dois fornecedores corretos\n    expect(supplier).toHaveLength(2);\n    expect(supplier[0].social_name).toEqual('Fornecedor A LTDA');\n    expect(supplier[1].social_name).toEqual('Fornecedor C ME');\n  });\n\n  it('should return an empty array if no suppliers are found with the given company name', async () => {\n    // Arrange\n    await suppliersRepository.create({\n      social_name: 'Fornecedor A LTDA',\n      company_name: 'Tech Corp',\n      phone_number: '11000001111',\n      cnpj: '11.111.111/0001-11',\n    });\n    \n    // Act: Executa o serviço com um nome de empresa que não existe\n    const { supplier } = await sut.execute({ companyName: 'Non-Existent Corp' });\n\n    // Assert: Verifica se a lista retornada está vazia\n    expect(supplier).toHaveLength(0);\n  });\n});\n"},"src/services/product/find-product-by-id.test.ts":{"tests":[{"id":"240","name":"Find Product By Id Service should be able to find a product by its id"},{"id":"241","name":"Find Product By Id Service should throw an error if the product is not found"},{"id":"242","name":"Find Product By Id Service should throw an error if the found product is inactive"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryProductsRepository } from '../../repositories/in-memory/in-memory-products-repository';\nimport { FindProductByIdService } from './find-product-by-id';\nimport { ResourceNotFoundError } from '../errors/resource-not-found-error';\nimport { InactiveError } from '../errors/inactive-error';\n\n// Declaração das variáveis\nlet productsRepository: InMemoryProductsRepository;\nlet sut: FindProductByIdService; // SUT: System Under Test\n\ndescribe('Find Product By Id Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    productsRepository = new InMemoryProductsRepository();\n    sut = new FindProductByIdService(productsRepository);\n  });\n\n  it('should be able to find a product by its id', async () => {\n    // Arrange: Cria um produto para ser encontrado\n    const createdProduct = await productsRepository.create({\n      name: 'Capacitor 100uF',\n      description: 'Capacitor eletrolítico',\n      price: 1.25,\n      quantity_in_stock: 500,\n      batch: 'E5F6G7H8'\n    });\n\n    // Act: Executa o serviço com o ID do produto criado\n    const { product } = await sut.execute({ productId: createdProduct.id });\n\n    // Assert: Verifica se o produto retornado é o correto\n    expect(product.id).toEqual(createdProduct.id);\n    expect(product.name).toEqual('Capacitor 100uF');\n  });\n\n  it('should throw an error if the product is not found', async () => {\n    // Act & Assert: Tenta buscar um produto com um ID inexistente e espera um erro\n    await expect(() =>\n      sut.execute({ productId: 'non-existing-id' })\n    ).rejects.toBeInstanceOf(ResourceNotFoundError);\n  });\n\n  it('should throw an error if the found product is inactive', async () => {\n    // Arrange: Cria um produto e o inativa\n    const createdProduct = await productsRepository.create({\n      name: 'Inactive Product',\n      description: 'This product is inactive',\n      price: 99,\n      quantity_in_stock: 10,\n      batch: 'I9J0K1L2'\n    });\n\n    await productsRepository.inactivate(createdProduct.id);\n\n    // Act & Assert: Tenta buscar o produto inativo e espera um erro específico\n    await expect(() =>\n      sut.execute({ productId: createdProduct.id })\n    ).rejects.toBeInstanceOf(InactiveError);\n  });\n});\n"},"src/services/user/user-authenticate.test.ts":{"tests":[{"id":"243","name":"User Authenticate Service should be able to authenticate a user"},{"id":"244","name":"User Authenticate Service should not be able to authenticate with wrong email"},{"id":"245","name":"User Authenticate Service should not be able to authenticate with wrong password"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\nimport { UserAuthenticateService } from './user-authenticate';\nimport { InvalidCredentialError } from '../errors/invalid-credential-error';\nimport { hash } from 'bcryptjs';\n\n// Declaração das variáveis\nlet usersRepository: InMemoryUsersRepository;\nlet sut: UserAuthenticateService; // SUT: System Under Test\n\ndescribe('User Authenticate Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    usersRepository = new InMemoryUsersRepository();\n    sut = new UserAuthenticateService(usersRepository);\n  });\n\n  it('should be able to authenticate a user', async () => {\n    // Arrange: Cria um usuário com uma senha criptografada\n    await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: await hash('password123', 6),\n      role: 'EMPLOYEE',\n    });\n\n    // Act: Executa o serviço com as credenciais corretas\n    const { user } = await sut.execute({\n      email: 'john.doe@example.com',\n      password: 'password123',\n    });\n\n    // Assert: Verifica se o ID do usuário retornado é válido\n    expect(user.id).toEqual(expect.any(String));\n  });\n\n  it('should not be able to authenticate with wrong email', async () => {\n    // Act & Assert: Tenta autenticar com um e-mail que não existe\n    await expect(() =>\n      sut.execute({\n        email: 'non-existing@example.com',\n        password: 'password123',\n      })\n    ).rejects.toBeInstanceOf(InvalidCredentialError);\n  });\n\n  it('should not be able to authenticate with wrong password', async () => {\n    // Arrange: Cria um usuário\n    await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: await hash('password123', 6),\n      role: 'EMPLOYEE',\n    });\n\n    // Act & Assert: Tenta autenticar com a senha errada\n    await expect(() =>\n      sut.execute({\n        email: 'john.doe@example.com',\n        password: 'wrong_password',\n      })\n    ).rejects.toBeInstanceOf(InvalidCredentialError);\n  });\n});\n"},"src/services/employee/fetch-all-employee.test.ts":{"tests":[{"id":"246","name":"Fetch All Employee Service should be able to fetch all employees"},{"id":"247","name":"Fetch All Employee Service should return an empty array when no employees are found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryEmployeesRepository } from '../../repositories/in-memory/in-memory-employee-repository';\nimport { FetchAllEmployeeService } from './fetch-all-employee';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\n\n// Declaração das variáveis\nlet employeesRepository: InMemoryEmployeesRepository;\nlet usersRepository: InMemoryUsersRepository;\nlet sut: FetchAllEmployeeService; // SUT: System Under Test\n\ndescribe('Fetch All Employee Service', () => {\n  beforeEach(() => {\n    // Instancia os repositórios e o serviço antes de cada teste\n    employeesRepository = new InMemoryEmployeesRepository();\n    usersRepository = new InMemoryUsersRepository(); // Necessário para criar dados de teste\n    sut = new FetchAllEmployeeService(employeesRepository);\n  });\n\n  it('should be able to fetch all employees', async () => {\n    // Arrange: Cria dados de teste\n    const user1 = await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'hashed_password'\n    });\n\n    const user2 = await usersRepository.create({\n        name: 'Jane Smith',\n        email: 'jane.smith@example.com',\n        password_hash: 'hashed_password'\n    });\n\n    await employeesRepository.create({\n      user: { connect: { id: user1.id } }\n    });\n\n    await employeesRepository.create({\n        user: { connect: { id: user2.id } }\n    });\n\n    // Act: Executa o serviço\n    const { employee } = await sut.execute();\n\n    // Assert: Verifica se o resultado está correto\n    expect(employee).toHaveLength(2);\n    expect(employee[0].userId).toEqual(user1.id);\n    expect(employee[1].userId).toEqual(user2.id);\n  });\n\n  it('should return an empty array when no employees are found', async () => {\n    // Act: Executa o serviço com o repositório vazio\n    const { employee } = await sut.execute();\n\n    // Assert: Verifica se o resultado é uma lista vazia\n    expect(employee).toHaveLength(0);\n  });\n});"},"src/services/supplier/patch-supplier.test.ts":{"tests":[{"id":"248","name":"Patch Supplier Service should be able to patch a supplier"},{"id":"249","name":"Patch Supplier Service should throw an error if the supplier to patch is not found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemorySuppliersRepository } from '../../repositories/in-memory/in-memory-supplier-repository';\nimport { PatchSupplierService } from './patch-supplier';\nimport { NoRecordsFoundError } from '../errors/no-records-found-error';\n\n// Declaração das variáveis\nlet suppliersRepository: InMemorySuppliersRepository;\nlet sut: PatchSupplierService; // SUT: System Under Test\n\ndescribe('Patch Supplier Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    suppliersRepository = new InMemorySuppliersRepository();\n    sut = new PatchSupplierService(suppliersRepository);\n  });\n\n  it('should be able to patch a supplier', async () => {\n    // Arrange: Cria um fornecedor para ser atualizado\n    const createdSupplier = await suppliersRepository.create({\n      social_name: 'Fornecedor A LTDA',\n      company_name: 'Empresa A',\n      phone_number: '11000001111',\n      cnpj: '11.111.111/0001-11',\n    });\n\n    // Act: Executa o serviço com novos dados parciais\n    const { supplier } = await sut.handle({\n      id: createdSupplier.id,\n      data: {\n        company_name: 'Empresa A (Filial)',\n        phone_number: '11999998888',\n      },\n    });\n\n    // Assert: Verifica se os campos foram atualizados e outros permaneceram iguais\n    expect(supplier?.company_name).toEqual('Empresa A (Filial)');\n    expect(supplier?.phone_number).toEqual('11999998888');\n    expect(supplier?.social_name).toEqual('Fornecedor A LTDA'); // Deve permanecer o mesmo\n  });\n\n  it('should throw an error if the supplier to patch is not found', async () => {\n    // Act & Assert: Tenta atualizar um fornecedor com um ID inexistente e espera um erro\n    await expect(() =>\n      sut.handle({\n        id: 'non-existing-id',\n        data: { company_name: 'New Company Name' },\n      })\n    ).rejects.toBeInstanceOf(NoRecordsFoundError);\n  });\n});\n"},"src/services/manager/fetch-all-manager.test.ts":{"tests":[{"id":"250","name":"Fetch All Manager Service should be able to fetch all managers"},{"id":"251","name":"Fetch All Manager Service should return an empty array when there are no managers"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryManagersRepository } from '../../repositories/in-memory/in-memory-manager-repository';\nimport { FetchAllManagerService } from './fetch-all-manager';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\n\n// Declaração das variáveis\nlet managersRepository: InMemoryManagersRepository;\nlet usersRepository: InMemoryUsersRepository;\nlet sut: FetchAllManagerService; // SUT: System Under Test\n\ndescribe('Fetch All Manager Service', () => {\n  beforeEach(() => {\n    // Instancia os repositórios e o serviço antes de cada teste\n    managersRepository = new InMemoryManagersRepository();\n    usersRepository = new InMemoryUsersRepository();\n    sut = new FetchAllManagerService(managersRepository);\n  });\n\n  it('should be able to fetch all managers', async () => {\n    // Arrange: Cria alguns usuários e gerentes para o teste\n    const user1 = await usersRepository.create({ name: 'User One', email: 'user1@example.com', password_hash: 'hash1' });\n    const user2 = await usersRepository.create({ name: 'User Two', email: 'user2@example.com', password_hash: 'hash2' });\n\n    await managersRepository.create({ user: { connect: { id: user1.id } } });\n    await managersRepository.create({ user: { connect: { id: user2.id } } });\n\n    // Act: Executa o serviço\n    const { managers } = await sut.execute();\n\n    // Assert: Verifica se a lista retornada contém 2 gerentes\n    expect(managers).toHaveLength(2);\n    expect(managers[0].userId).toEqual(user1.id);\n    expect(managers[1].userId).toEqual(user2.id);\n  });\n\n  it('should return an empty array when there are no managers', async () => {\n    // Act: Executa o serviço sem nenhum gerente cadastrado\n    const { managers } = await sut.execute();\n\n    // Assert: Verifica se a lista retornada está vazia\n    expect(managers).toHaveLength(0);\n  });\n});\n"},"src/services/manager/find-manager-by-id.test.ts":{"tests":[{"id":"252","name":"Find Manager By Id Service should be able to find a manager by id"},{"id":"253","name":"Find Manager By Id Service should throw an error if the manager is not found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryManagersRepository } from '../../repositories/in-memory/in-memory-manager-repository';\nimport { FindManagerByIdService } from './find-manager-by-id';\nimport { NoRecordsFoundError } from '../errors/no-records-found-error';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\n\n// Declaração das variáveis\nlet managersRepository: InMemoryManagersRepository;\nlet usersRepository: InMemoryUsersRepository;\nlet sut: FindManagerByIdService; // SUT: System Under Test\n\ndescribe('Find Manager By Id Service', () => {\n  beforeEach(() => {\n    // Instancia os repositórios e o serviço antes de cada teste\n    managersRepository = new InMemoryManagersRepository();\n    usersRepository = new InMemoryUsersRepository(); // Necessário para o contexto do gerente\n    sut = new FindManagerByIdService(managersRepository);\n  });\n\n  it('should be able to find a manager by id', async () => {\n    // Arrange: Cria um usuário e um gerente para serem encontrados\n    const user = await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'hashed_password'\n    });\n\n    const createdManager = await managersRepository.create({\n      user: { connect: { id: user.id } }\n    });\n\n    // Act: Executa o serviço com o ID do gerente criado\n    const { manager } = await sut.execute({ id: createdManager.id });\n\n    // Assert: Verifica se o gerente retornado é o correto\n    expect(manager).not.toBeNull();\n    expect(manager?.id).toEqual(createdManager.id);\n  });\n\n  it('should throw an error if the manager is not found', async () => {\n    // Act & Assert: Tenta buscar um gerente com um ID inexistente e espera um erro\n    await expect(() =>\n      sut.execute({ id: 'non-existing-id' })\n    ).rejects.toBeInstanceOf(NoRecordsFoundError);\n  });\n});\n"},"src/services/employee/find-employee-by-user-id.test.ts":{"tests":[{"id":"254","name":"Find Employee By User Id Service should be able to find an employee by user id"},{"id":"255","name":"Find Employee By User Id Service should return null if employee is not found with the given user id"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryEmployeesRepository } from '../../repositories/in-memory/in-memory-employee-repository';\nimport { FindEmployeeByUserId } from './find-employee-by-user-id';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\n\n// Declaração das variáveis\nlet employeesRepository: InMemoryEmployeesRepository;\nlet usersRepository: InMemoryUsersRepository;\nlet sut: FindEmployeeByUserId; // SUT: System Under Test\n\ndescribe('Find Employee By User Id Service', () => {\n  beforeEach(() => {\n    // Instancia os repositórios e o serviço antes de cada teste\n    employeesRepository = new InMemoryEmployeesRepository();\n    usersRepository = new InMemoryUsersRepository();\n    sut = new FindEmployeeByUserId(employeesRepository);\n  });\n\n  it('should be able to find an employee by user id', async () => {\n    // Arrange: Cria um usuário e um funcionário para o teste\n    const user = await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'hashed_password'\n    });\n\n    await employeesRepository.create({\n      user: { connect: { id: user.id } }\n    });\n\n    // Act: Executa o serviço com o ID do usuário criado\n    const { employee } = await sut.execute({ userId: user.id });\n\n    // Assert: Verifica se o funcionário retornado não é nulo e tem o userId correto\n    expect(employee).not.toBeNull();\n    expect(employee?.userId).toEqual(user.id);\n  });\n\n  it('should return null if employee is not found with the given user id', async () => {\n    // Act: Tenta buscar um funcionário com um ID de usuário que não existe\n    const { employee } = await sut.execute({ userId: 'non-existing-user-id' });\n\n    // Assert: Verifica se o resultado é nulo\n    expect(employee).toBeNull();\n  });\n});\n"},"src/services/employee/find-employee-by-id.test.ts":{"tests":[{"id":"256","name":"Find Employee By Id Service should be able to find an employee by id"},{"id":"257","name":"Find Employee By Id Service should return null if employee is not found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryEmployeesRepository } from '../../repositories/in-memory/in-memory-employee-repository';\nimport { FindEmployeeByIdService } from './find-employee-by-id';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\n\n// Declaração das variáveis\nlet employeesRepository: InMemoryEmployeesRepository;\nlet usersRepository: InMemoryUsersRepository;\nlet sut: FindEmployeeByIdService; // SUT: System Under Test\n\ndescribe('Find Employee By Id Service', () => {\n  beforeEach(() => {\n    // Instancia os repositórios e o serviço antes de cada teste\n    employeesRepository = new InMemoryEmployeesRepository();\n    usersRepository = new InMemoryUsersRepository();\n    sut = new FindEmployeeByIdService(employeesRepository);\n  });\n\n  it('should be able to find an employee by id', async () => {\n    // Arrange: Cria um usuário e um funcionário para o teste\n    const user = await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'hashed_password'\n    });\n\n    const createdEmployee = await employeesRepository.create({\n      user: { connect: { id: user.id } }\n    });\n\n    // Act: Executa o serviço com o ID do funcionário criado\n    const { employee } = await sut.execute({ id: createdEmployee.id });\n\n    // Assert: Verifica se o funcionário retornado não é nulo e tem o ID correto\n    expect(employee).not.toBeNull();\n    expect(employee?.id).toEqual(createdEmployee.id);\n  });\n\n  it('should return null if employee is not found', async () => {\n    // Act: Tenta buscar um funcionário com um ID que não existe\n    const { employee } = await sut.execute({ id: 'non-existing-id' });\n\n    // Assert: Verifica se o resultado é nulo\n    expect(employee).toBeNull();\n  });\n});\n"},"src/services/manager/find-manager-by-user-id.test.ts":{"tests":[{"id":"258","name":"Find Manager By User Id Service should be able to find a manager by user id"},{"id":"259","name":"Find Manager By User Id Service should return null if no manager is found for the user id"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryManagersRepository } from '../../repositories/in-memory/in-memory-manager-repository';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\nimport { FindManagerByUserId } from './find-manager-by-user-id';\n\n// Declaração das variáveis\nlet managersRepository: InMemoryManagersRepository;\nlet usersRepository: InMemoryUsersRepository;\nlet sut: FindManagerByUserId; // SUT: System Under Test\n\ndescribe('Find Manager By User Id Service', () => {\n  beforeEach(() => {\n    // Instancia os repositórios e o serviço antes de cada teste\n    managersRepository = new InMemoryManagersRepository();\n    usersRepository = new InMemoryUsersRepository();\n    sut = new FindManagerByUserId(managersRepository);\n  });\n\n  it('should be able to find a manager by user id', async () => {\n    // Arrange: Cria um usuário e um gerente para serem encontrados\n    const user = await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'hashed_password'\n    });\n\n    await managersRepository.create({\n      user: { connect: { id: user.id } }\n    });\n\n    // Act: Executa o serviço com o ID do usuário criado\n    const { manager } = await sut.execute({ userId: user.id });\n\n    // Assert: Verifica se o gerente retornado é o correto\n    expect(manager).not.toBeNull();\n    expect(manager?.userId).toEqual(user.id);\n  });\n\n  it('should return null if no manager is found for the user id', async () => {\n    // Act: Tenta buscar um gerente com um ID de usuário inexistente\n    const { manager } = await sut.execute({ userId: 'non-existing-user-id' });\n\n    // Assert: Verifica se o resultado é nulo\n    expect(manager).toBeNull();\n  });\n});\n"},"src/services/supplier/fetch-all-supplier.test.ts":{"tests":[{"id":"260","name":"Fetch All Supplier Service should be able to fetch all suppliers"},{"id":"261","name":"Fetch All Supplier Service should return an empty array if no suppliers are found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemorySuppliersRepository } from '../../repositories/in-memory/in-memory-supplier-repository';\nimport { FetchAllSupplierService } from './fetch-all-supplier';\n\n// Declaração das variáveis\nlet suppliersRepository: InMemorySuppliersRepository;\nlet sut: FetchAllSupplierService; // SUT: System Under Test\n\ndescribe('Fetch All Supplier Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    suppliersRepository = new InMemorySuppliersRepository();\n    sut = new FetchAllSupplierService(suppliersRepository);\n  });\n\n  it('should be able to fetch all suppliers', async () => {\n    // Arrange: Cria dois fornecedores de exemplo\n    await suppliersRepository.create({\n      social_name: 'Fornecedor A LTDA',\n      company_name: 'Empresa A',\n      phone_number: '11000001111',\n      cnpj: '11.111.111/0001-11',\n    });\n\n    await suppliersRepository.create({\n      social_name: 'Fornecedor B SA',\n      company_name: 'Empresa B',\n      phone_number: '22000002222',\n      cnpj: '22.222.222/0001-22',\n    });\n\n    // Act: Executa o serviço\n    const { supplier } = await sut.execute();\n\n    // Assert: Verifica se a lista retornada contém os dois fornecedores\n    expect(supplier).toHaveLength(2);\n    expect(supplier[0].company_name).toEqual('Empresa A');\n    expect(supplier[1].company_name).toEqual('Empresa B');\n  });\n\n  it('should return an empty array if no suppliers are found', async () => {\n    // Act: Executa o serviço com o repositório vazio\n    const { supplier } = await sut.execute();\n\n    // Assert: Verifica se a lista retornada está vazia\n    expect(supplier).toHaveLength(0);\n  });\n});\n"},"src/services/product/fetch-all-product.test.ts":{"tests":[{"id":"262","name":"Fetch All Product Service should be able to fetch all products"},{"id":"263","name":"Fetch All Product Service should return an empty array when no products are found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryProductsRepository } from '../../repositories/in-memory/in-memory-products-repository';\nimport { FetchAllProductService } from './fetch-all-product';\n\n// Declaração das variáveis\nlet productsRepository: InMemoryProductsRepository;\nlet sut: FetchAllProductService; // SUT: System Under Test\n\ndescribe('Fetch All Product Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    productsRepository = new InMemoryProductsRepository();\n    sut = new FetchAllProductService(productsRepository);\n  });\n\n  it('should be able to fetch all products', async () => {\n    // Arrange: Cria alguns produtos para serem encontrados\n    await productsRepository.create({\n      name: 'Product 1',\n      description: 'Description 1',\n      price: 10,\n      quantity_in_stock: 100,\n      batch: 'B1'\n    });\n    await productsRepository.create({\n      name: 'Product 2',\n      description: 'Description 2',\n      price: 20,\n      quantity_in_stock: 200,\n      batch: 'B2'\n    });\n\n    // Act: Executa o serviço\n    const { product } = await sut.execute();\n\n    // Assert: Verifica se a lista de produtos retornada está correta\n    expect(product).toHaveLength(2);\n    expect(product[0].name).toEqual('Product 1');\n    expect(product[1].name).toEqual('Product 2');\n  });\n\n  it('should return an empty array when no products are found', async () => {\n    // Act: Executa o serviço com o repositório vazio\n    const { product } = await sut.execute();\n\n    // Assert: Verifica se o resultado é uma lista vazia\n    expect(product).toEqual([]);\n  });\n});\n"},"src/services/purchase/fetch-all-purchase.test.ts":{"tests":[{"id":"264","name":"Fetch All Purchase Service should be able to fetch all purchases"},{"id":"265","name":"Fetch All Purchase Service should return an empty array when there are no purchases"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryPurchaseRepository } from '../../repositories/in-memory/in-memory-purchase-repository';\nimport { FetchAllPurchaseService } from './fetch-all-purchase';\n\n// Declaração das variáveis\nlet purchaseRepository: InMemoryPurchaseRepository;\nlet sut: FetchAllPurchaseService; // SUT: System Under Test\n\ndescribe('Fetch All Purchase Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    purchaseRepository = new InMemoryPurchaseRepository();\n    sut = new FetchAllPurchaseService(purchaseRepository);\n  });\n\n  it('should be able to fetch all purchases', async () => {\n    // Arrange: Cria algumas compras de exemplo\n    await purchaseRepository.create({\n      nf_number: 'NF-001',\n      supplier: { connect: { id: 'supplier-01' } },\n      user: { connect: { id: 'user-01' } },\n    });\n\n    await purchaseRepository.create({\n      nf_number: 'NF-002',\n      supplier: { connect: { id: 'supplier-02' } },\n      user: { connect: { id: 'user-02' } },\n    });\n\n    // Act: Executa o serviço\n    const { purchase } = await sut.execute();\n\n    // Assert: Verifica se todas as compras foram retornadas\n    expect(purchase).toHaveLength(2);\n    expect(purchase[0].nf_number).toEqual('NF-001');\n    expect(purchase[1].nf_number).toEqual('NF-002');\n  });\n\n  it('should return an empty array when there are no purchases', async () => {\n    // Act: Executa o serviço com o repositório vazio\n    const { purchase } = await sut.execute();\n\n    // Assert: Verifica se um array vazio é retornado\n    expect(purchase).toHaveLength(0);\n  });\n});\n"},"src/services/supplier/find-supplier-by-id.test.ts":{"tests":[{"id":"266","name":"Find Supplier by ID Service should be able to find a supplier by id"},{"id":"267","name":"Find Supplier by ID Service should throw an error if the supplier is not found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemorySuppliersRepository } from '../../repositories/in-memory/in-memory-supplier-repository';\nimport { FindSupplierByIdService } from './find-supplier-by-id';\nimport { NoRecordsFoundError } from '../errors/no-records-found-error';\n\n// Declaração das variáveis\nlet suppliersRepository: InMemorySuppliersRepository;\nlet sut: FindSupplierByIdService; // SUT: System Under Test\n\ndescribe('Find Supplier by ID Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    suppliersRepository = new InMemorySuppliersRepository();\n    sut = new FindSupplierByIdService(suppliersRepository);\n  });\n\n  it('should be able to find a supplier by id', async () => {\n    // Arrange: Cria um fornecedor de exemplo\n    const createdSupplier = await suppliersRepository.create({\n      social_name: 'Fornecedor A LTDA',\n      company_name: 'Empresa A',\n      phone_number: '11000001111',\n      cnpj: '11.111.111/0001-11',\n    });\n\n    // Act: Executa o serviço com o ID do fornecedor criado\n    const { supplier } = await sut.execute({ supplierId: createdSupplier.id });\n\n    // Assert: Verifica se o fornecedor retornado é o correto\n    expect(supplier.id).toEqual(createdSupplier.id);\n    expect(supplier.company_name).toEqual('Empresa A');\n  });\n\n  it('should throw an error if the supplier is not found', async () => {\n    // Act & Assert: Tenta buscar um fornecedor com um ID inexistente e espera um erro\n    await expect(() =>\n      sut.execute({ supplierId: 'non-existing-id' })\n    ).rejects.toBeInstanceOf(NoRecordsFoundError);\n  });\n});\n"},"src/services/purchase/find-purchase-by-id.test.ts":{"tests":[{"id":"268","name":"Find Purchase By Id Service should be able to find a purchase by its id"},{"id":"269","name":"Find Purchase By Id Service should throw an error if the purchase is not found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryPurchaseRepository } from '../../repositories/in-memory/in-memory-purchase-repository';\nimport { FindPurchaseByIdService } from './find-purchase-by-id';\nimport { ResourceNotFoundError } from '../errors/resource-not-found-error';\n\n// Declaração das variáveis\nlet purchaseRepository: InMemoryPurchaseRepository;\nlet sut: FindPurchaseByIdService; // SUT: System Under Test\n\ndescribe('Find Purchase By Id Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    purchaseRepository = new InMemoryPurchaseRepository();\n    sut = new FindPurchaseByIdService(purchaseRepository);\n  });\n\n  it('should be able to find a purchase by its id', async () => {\n    // Arrange: Cria uma compra de exemplo\n    const createdPurchase = await purchaseRepository.create({\n      nf_number: 'NF-123',\n      supplier: { connect: { id: 'supplier-01' } },\n      user: { connect: { id: 'user-01' } },\n    });\n\n    // Act: Executa o serviço buscando a compra pelo ID\n    const { purchase } = await sut.execute({ purchaseId: createdPurchase.id });\n\n    // Assert: Verifica se a compra retornada é a correta\n    expect(purchase.id).toEqual(createdPurchase.id);\n    expect(purchase.nf_number).toEqual('NF-123');\n  });\n\n  it('should throw an error if the purchase is not found', async () => {\n    // Act & Assert: Tenta buscar uma compra com um ID inexistente e espera um erro\n    await expect(() =>\n      sut.execute({ purchaseId: 'non-existing-id' })\n    ).rejects.toBeInstanceOf(ResourceNotFoundError);\n  });\n});\n"},"src/services/supplier/delete-supplier.test.ts":{"tests":[{"id":"270","name":"Delete Supplier Service should be able to delete a supplier"},{"id":"271","name":"Delete Supplier Service should throw an error if the supplier is not found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemorySuppliersRepository } from '../../repositories/in-memory/in-memory-supplier-repository';\nimport { DeleteSupplierService } from './delete-supplier';\nimport { NoRecordsFoundError } from '../errors/no-records-found-error';\n\n// Declaração das variáveis\nlet suppliersRepository: InMemorySuppliersRepository;\nlet sut: DeleteSupplierService; // SUT: System Under Test\n\ndescribe('Delete Supplier Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    suppliersRepository = new InMemorySuppliersRepository();\n    sut = new DeleteSupplierService(suppliersRepository);\n  });\n\n  it('should be able to delete a supplier', async () => {\n    // Arrange: Cria um fornecedor para ser deletado\n    const createdSupplier = await suppliersRepository.create({\n      social_name: 'Fornecedor Teste LTDA',\n      company_name: 'Teste Corp',\n      phone_number: '11999998888',\n      cnpj: '98.765.432/0001-11',\n    });\n\n    // Act: Executa o serviço de deleção\n    await sut.execute({ id: createdSupplier.id });\n\n    // Assert: Verifica se o fornecedor foi removido do repositório\n    const supplier = await suppliersRepository.findById(createdSupplier.id);\n    expect(supplier).toBeNull();\n  });\n\n  it('should throw an error if the supplier is not found', async () => {\n    // Act & Assert: Tenta deletar um fornecedor com um ID inexistente e espera um erro\n    await expect(() =>\n      sut.execute({ id: 'non-existing-id' })\n    ).rejects.toBeInstanceOf(NoRecordsFoundError);\n  });\n});\n"},"src/services/user/get-all-users.test.ts":{"tests":[{"id":"272","name":"Get All Users Service should be able to get all users"},{"id":"273","name":"Get All Users Service should return an empty array if no users are found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\nimport { GetAllUsersService } from './get-all-users';\n\n// Declaração das variáveis\nlet usersRepository: InMemoryUsersRepository;\nlet sut: GetAllUsersService; // SUT: System Under Test\n\ndescribe('Get All Users Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    usersRepository = new InMemoryUsersRepository();\n    sut = new GetAllUsersService(usersRepository);\n  });\n\n  it('should be able to get all users', async () => {\n    // Arrange: Cria alguns usuários para teste\n    await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'hashed_password_1',\n      role: 'EMPLOYEE',\n    });\n    await usersRepository.create({\n      name: 'Jane Doe',\n      email: 'jane.doe@example.com',\n      password_hash: 'hashed_password_2',\n      role: 'MANAGER',\n    });\n\n    // Act: Executa o serviço\n    const { users } = await sut.execute();\n\n    // Assert: Verifica se a lista retornada contém os dois usuários\n    expect(users.length).toBe(2);\n    expect(users[0].name).toEqual('John Doe');\n    expect(users[1].name).toEqual('Jane Doe');\n  });\n\n  it('should return an empty array if no users are found', async () => {\n    // Act: Executa o serviço com o repositório vazio\n    const { users } = await sut.execute();\n\n    // Assert: Verifica se a lista retornada está vazia\n    expect(users.length).toBe(0);\n  });\n});\n"},"src/services/product/inactivate-product.test.ts":{"tests":[{"id":"274","name":"Inactivate Product Service should be able to inactivate a product"},{"id":"275","name":"Inactivate Product Service should throw an error if the product does not exist"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryProductsRepository } from '../../repositories/in-memory/in-memory-products-repository';\nimport { InactivateProductService } from './inactivate-product';\n\n// Declaração das variáveis\nlet productsRepository: InMemoryProductsRepository;\nlet sut: InactivateProductService; // SUT: System Under Test\n\ndescribe('Inactivate Product Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    productsRepository = new InMemoryProductsRepository();\n    sut = new InactivateProductService(productsRepository);\n  });\n\n  it('should be able to inactivate a product', async () => {\n    // Arrange: Cria um produto para ser inativado\n    const createdProduct = await productsRepository.create({\n      name: 'Product to Inactivate',\n      description: 'A test product',\n      price: 50,\n      quantity_in_stock: 100,\n      batch: 'B1'\n    });\n\n    // Act: Executa o serviço com o ID do produto criado\n    await sut.execute({ productId: createdProduct.id });\n\n    // Assert: Verifica se o produto foi marcado como inativo no repositório\n    const productInDb = await productsRepository.findById(createdProduct.id);\n    expect(productInDb?.is_active).toBe(false);\n  });\n\n  it('should throw an error if the product does not exist', async () => {\n    // Act & Assert: Tenta inativar um produto com um ID inexistente e espera um erro\n    await expect(() =>\n      sut.execute({ productId: 'non-existing-id' })\n    ).rejects.toThrow('Product not found');\n  });\n});\n"},"src/services/user/get-user-profile.test.ts":{"tests":[{"id":"276","name":"Get User Profile Service should be able to get user profile"},{"id":"277","name":"Get User Profile Service should throw an error if the user is not found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\nimport { GetUserProfileService } from './get-user-profile';\nimport { ResourceNotFoundError } from '../errors/resource-not-found-error';\n\n// Declaração das variáveis\nlet usersRepository: InMemoryUsersRepository;\nlet sut: GetUserProfileService; // SUT: System Under Test\n\ndescribe('Get User Profile Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    usersRepository = new InMemoryUsersRepository();\n    sut = new GetUserProfileService(usersRepository);\n  });\n\n  it('should be able to get user profile', async () => {\n    // Arrange: Cria um usuário para ter o perfil buscado\n    const createdUser = await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'hashed_password_1',\n      role: 'EMPLOYEE',\n    });\n\n    // Act: Executa o serviço\n    const { user } = await sut.execute({ userId: createdUser.id });\n\n    // Assert: Verifica se o usuário retornado é o correto\n    expect(user.id).toEqual(createdUser.id);\n    expect(user.name).toEqual('John Doe');\n  });\n\n  it('should throw an error if the user is not found', async () => {\n    // Act & Assert: Tenta buscar o perfil de um usuário com ID inexistente e espera um erro\n    await expect(() =>\n      sut.execute({ userId: 'non-existing-id' })\n    ).rejects.toBeInstanceOf(ResourceNotFoundError);\n  });\n});\n"},"src/services/user/get-user-by-id.test.ts":{"tests":[{"id":"278","name":"Get User By Id Service should be able to get a user by id"},{"id":"279","name":"Get User By Id Service should throw an error if the user is not found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\nimport { GetUserByIdService } from './get-user-by-id';\nimport { ResourceNotFoundError } from '../errors/resource-not-found-error';\n\n// Declaração das variáveis\nlet usersRepository: InMemoryUsersRepository;\nlet sut: GetUserByIdService; // SUT: System Under Test\n\ndescribe('Get User By Id Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    usersRepository = new InMemoryUsersRepository();\n    sut = new GetUserByIdService(usersRepository);\n  });\n\n  it('should be able to get a user by id', async () => {\n    // Arrange: Cria um usuário para ser buscado\n    const createdUser = await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'hashed_password_1',\n      role: 'EMPLOYEE',\n    });\n\n    // Act: Executa o serviço\n    const { user } = await sut.execute({ userId: createdUser.id });\n\n    // Assert: Verifica se o usuário retornado é o correto\n    expect(user.id).toEqual(createdUser.id);\n    expect(user.name).toEqual('John Doe');\n  });\n\n  it('should throw an error if the user is not found', async () => {\n    // Act & Assert: Tenta buscar um usuário com um ID inexistente e espera um erro\n    await expect(() =>\n      sut.execute({ userId: 'non-existing-id' })\n    ).rejects.toBeInstanceOf(ResourceNotFoundError);\n  });\n});\n"},"src/services/sale/find-sale-by-id.test.ts":{"tests":[{"id":"280","name":"Find Sale By Id Service should be able to find a sale by id"},{"id":"281","name":"Find Sale By Id Service should throw an error if the sale is not found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemorySaleRepository } from '../../repositories/in-memory/in-memory-sale-repository';\nimport { FindSaleByIdService } from './find-sale-by-id';\nimport { ResourceNotFoundError } from '../errors/resource-not-found-error';\n\n// Declaração das variáveis\nlet saleRepository: InMemorySaleRepository;\nlet sut: FindSaleByIdService; // SUT: System Under Test\n\ndescribe('Find Sale By Id Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    saleRepository = new InMemorySaleRepository();\n    sut = new FindSaleByIdService(saleRepository);\n  });\n\n  it('should be able to find a sale by id', async () => {\n    // Arrange: Cria uma venda de exemplo\n    const createdSale = await saleRepository.create({\n      nf_number: 'NF-SALE-01',\n      user: { connect: { id: 'user-01' } },\n    });\n\n    // Act: Executa o serviço com o ID da venda criada\n    const { sale } = await sut.execute({ saleId: createdSale.id });\n\n    // Assert: Verifica se a venda retornada é a correta\n    expect(sale.id).toEqual(createdSale.id);\n    expect(sale.nf_number).toEqual('NF-SALE-01');\n  });\n\n  it('should throw an error if the sale is not found', async () => {\n    // Act & Assert: Tenta buscar uma venda com um ID inexistente e espera um erro\n    await expect(() =>\n      sut.execute({ saleId: 'non-existing-id' })\n    ).rejects.toBeInstanceOf(ResourceNotFoundError);\n  });\n});\n"},"src/services/user/delete-user.test.ts":{"tests":[{"id":"282","name":"Delete User Service should be able to delete a user"},{"id":"283","name":"Delete User Service should throw an error if the user is not found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\nimport { DeleteUserService } from './delete-user';\n\n// Declaração das variáveis\nlet usersRepository: InMemoryUsersRepository;\nlet sut: DeleteUserService; // SUT: System Under Test\n\ndescribe('Delete User Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    usersRepository = new InMemoryUsersRepository();\n    sut = new DeleteUserService(usersRepository);\n  });\n\n  it('should be able to delete a user', async () => {\n    // Arrange: Cria um usuário para ser deletado\n    const createdUser = await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'hashed_password',\n      role: 'EMPLOYEE',\n    });\n\n    // Act: Executa o serviço de exclusão\n    const { user } = await sut.execute({ id: createdUser.id });\n\n    // Assert: Verifica se o usuário retornado é o correto e se ele foi removido do repositório\n    expect(user.id).toEqual(createdUser.id);\n    expect(usersRepository.items.length).toBe(0);\n  });\n\n  it('should throw an error if the user is not found', async () => {\n    // Act & Assert: Tenta deletar um usuário com um ID inexistente e espera um erro\n    await expect(() =>\n      sut.execute({ id: 'non-existing-id' })\n    ).rejects.toThrow('User not found');\n  });\n});\n"},"src/services/sale/fetch-all-sale.test.ts":{"tests":[{"id":"284","name":"Fetch All Sale Service should be able to fetch all sales"},{"id":"285","name":"Fetch All Sale Service should return an empty array when there are no sales"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemorySaleRepository } from '../../repositories/in-memory/in-memory-sale-repository';\nimport { FetchAllSaleService } from './fetch-all-sale';\n\n// Declaração das variáveis\nlet saleRepository: InMemorySaleRepository;\nlet sut: FetchAllSaleService; // SUT: System Under Test\n\ndescribe('Fetch All Sale Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    saleRepository = new InMemorySaleRepository();\n    sut = new FetchAllSaleService(saleRepository);\n  });\n\n  it('should be able to fetch all sales', async () => {\n    // Arrange: Cria algumas vendas de exemplo\n    await saleRepository.create({\n      nf_number: 'NF-SALE-01',\n      user: { connect: { id: 'user-01' } },\n    });\n\n    await saleRepository.create({\n      nf_number: 'NF-SALE-02',\n      user: { connect: { id: 'user-02' } },\n    });\n\n    // Act: Executa o serviço\n    const { sale } = await sut.execute();\n\n    // Assert: Verifica se todas as vendas foram retornadas\n    expect(sale).toHaveLength(2);\n    expect(sale[0].nf_number).toEqual('NF-SALE-01');\n  });\n\n  it('should return an empty array when there are no sales', async () => {\n    // Act: Executa o serviço com o repositório vazio\n    const { sale } = await sut.execute();\n\n    // Assert: Verifica se um array vazio é retornado\n    expect(sale).toHaveLength(0);\n  });\n});\n"},"src/services/product/create-product.test.ts":{"tests":[{"id":"286","name":"Create Product Service should be able to create a new product"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryProductsRepository } from '../../repositories/in-memory/in-memory-products-repository';\nimport { CreateProductService } from './create-product';\n\n// Declaração das variáveis\nlet productsRepository: InMemoryProductsRepository;\nlet sut: CreateProductService; // SUT: System Under Test\n\ndescribe('Create Product Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    productsRepository = new InMemoryProductsRepository();\n    sut = new CreateProductService(productsRepository);\n  });\n\n  it('should be able to create a new product', async () => {\n    // Arrange: Define os dados do produto a ser criado\n    const productData = {\n      name: 'Resistor 10k Ohm',\n      description: 'Resistor de filme de carbono',\n      price: 0.50,\n      quantity_in_stock: 1000,\n      batch: 'A1B2C3D4'\n    };\n\n    // Act: Executa o serviço com os dados do produto\n    const { product } = await sut.handle(productData);\n\n    // Assert: Verifica se o produto foi criado corretamente\n    expect(product.id).toEqual(expect.any(String));\n    expect(product.name).toEqual('Resistor 10k Ohm');\n    expect(productsRepository.items).toHaveLength(1);\n    expect(productsRepository.items[0].id).toEqual(product.id);\n  });\n});\n"},"src/services/supplier/create-supplier.test.ts":{"tests":[{"id":"287","name":"Create Supplier Service should be able to create a new supplier"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemorySuppliersRepository } from '../../repositories/in-memory/in-memory-supplier-repository';\nimport { CreateSupplierService } from './create-supplier';\n\n// Declaração das variáveis\nlet suppliersRepository: InMemorySuppliersRepository;\nlet sut: CreateSupplierService; // SUT: System Under Test\n\ndescribe('Create Supplier Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    suppliersRepository = new InMemorySuppliersRepository();\n    sut = new CreateSupplierService(suppliersRepository);\n  });\n\n  it('should be able to create a new supplier', async () => {\n    // Act: Executa o serviço com os dados de um novo fornecedor\n    const { supplier } = await sut.handle({\n      social_name: 'Eletrônicos Fantasia LTDA',\n      company_name: 'Fantasia Corp',\n      phone_number: '11987654321',\n      cnpj: '12.345.678/0001-99',\n    });\n\n    // Assert: Verifica se o fornecedor foi criado com um ID e se está no repositório\n    expect(supplier.id).toEqual(expect.any(String));\n    expect(suppliersRepository.items[0].company_name).toEqual('Fantasia Corp');\n  });\n});\n"}},"projectRoot":"/home/luis/sig-estoque/sig-estoque-back-end","config":{"$schema":"./node_modules/@stryker-mutator/core/schema/stryker-schema.json","_comment":"This config was generated using 'stryker init'. Please take a look at: https://stryker-mutator.io/docs/stryker-js/configuration/ for more information.","packageManager":"npm","reporters":["html","clear-text","progress"],"testRunner":"vitest","testRunner_comment":"Take a look at https://stryker-mutator.io/docs/stryker-js/vitest-runner for information about the vitest plugin.","coverageAnalysis":"perTest","mutate"
