est as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.send).toHaveBeenCalledWith({\n      product: productsWithVariousPrices\n    });\n  });\n\n  it('should handle service returning null or undefined products', async () => {\n    // Arrange\n    mockFetchAllProductService.execute.mockResolvedValue({\n      product: null\n    });\n\n    // Act\n    await fetchAllProduct(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.code).toHaveBeenCalledWith(200);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      product: null\n    });\n  });\n\n  it('should handle various error types from service', async () => {\n    // Arrange\n    const errorTypes = [\n      new Error('Generic error'),\n      new TypeError('Type error'),\n      new RangeError('Range error'),\n      { customError: 'Custom error object' },\n      'String error'\n    ];\n\n    for (const error of errorTypes) {\n      mockFetchAllProductService.execute.mockRejectedValue(error);\n\n      // Act & Assert - deve rejeitar com o erro original\n      await expect(\n        fetchAllProduct(mockRequest as FastifyRequest, mockReply as FastifyReply)\n      ).rejects.toBe(error);\n\n      // Reset para próximo teste\n      vi.clearAllMocks();\n    }\n  });\n\n  it('should handle products with minimal data', async () => {\n    // Arrange\n    const minimalProducts = [\n      {\n        id: '1',\n        name: 'P',\n        description: 'D',\n        price: 1,\n        quantity_in_stock: 1,\n        batch: 'B',\n        created_at: new Date(),\n        updated_at: new Date()\n      }\n    ];\n\n    mockFetchAllProductService.execute.mockResolvedValue({\n      product: minimalProducts\n    });\n\n    // Act\n    await fetchAllProduct(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.send).toHaveBeenCalledWith({\n      product: minimalProducts\n    });\n  });\n\n  it('should handle single product in array', async () => {\n    // Arrange\n    const singleProduct = [\n      {\n        id: '1',\n        name: 'Solo Product',\n        description: 'Single product description',\n        price: 19.99,\n        quantity_in_stock: 10,\n        batch: 'SOLO1',\n        created_at: new Date(),\n        updated_at: new Date()\n      }\n    ];\n\n    mockFetchAllProductService.execute.mockResolvedValue({\n      product: singleProduct\n    });\n\n    // Act\n    await fetchAllProduct(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.send).toHaveBeenCalledWith({\n      product: singleProduct\n    });\n    expect(singleProduct).toHaveLength(1);\n  });\n\n  it('should preserve product data structure', async () => {\n    // Arrange\n    const productsWithCompleteData = [\n      {\n        id: '1',\n        name: 'Complete Product',\n        description: 'Product with all fields',\n        price: 49.99,\n        quantity_in_stock: 25,\n        batch: 'COMP1',\n        created_at: new Date('2023-01-01'),\n        updated_at: new Date('2023-01-02'),\n        // Outros campos que podem existir\n        category: 'Electronics',\n        is_active: true,\n        supplier: 'Supplier A'\n      }\n    ];\n\n    mockFetchAllProductService.execute.mockResolvedValue({\n      product: productsWithCompleteData\n    });\n\n    // Act\n    await fetchAllProduct(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.send).toHaveBeenCalledWith({\n      product: productsWithCompleteData\n    });\n    // Verifica se a estrutura de dados é preservada\n    expect(mockReply.send).toHaveBeenCalledWith(\n      expect.objectContaining({\n        product: expect.arrayContaining([\n          expect.objectContaining({\n            id: expect.any(String),\n            name: expect.any(String),\n            description: expect.any(String),\n            price: expect.any(Number),\n            quantity_in_stock: expect.any(Number),\n            batch: expect.any(String),\n            created_at: expect.any(Date),\n            updated_at: expect.any(Date)\n          })\n        ])\n      })\n    );\n  });\n\n  it('should handle products with different batch formats', async () => {\n    // Arrange\n    const productsWithVariousBatches = [\n      {\n        id: '1',\n        name: 'Product 1',\n        description: 'Description 1',\n        price: 29.99,\n        quantity_in_stock: 100,\n        batch: 'ABC123',\n        created_at: new Date(),\n        updated_at: new Date()\n      },\n      {\n        id: '2',\n        name: 'Product 2',\n        description: 'Description 2',\n        price: 39.99,\n        quantity_in_stock: 50,\n        batch: 'XYZ789',\n        created_at: new Date(),\n        updated_at: new Date()\n      },\n      {\n        id: '3',\n        name: 'Product 3',\n        description: 'Description 3',\n        price: 49.99,\n        quantity_in_stock: 75,\n        batch: 'BATCH01',\n        created_at: new Date(),\n        updated_at: new Date()\n      }\n    ];\n\n    mockFetchAllProductService.execute.mockResolvedValue({\n      product: productsWithVariousBatches\n    });\n\n    // Act\n    await fetchAllProduct(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.send).toHaveBeenCalledWith({\n      product: productsWithVariousBatches\n    });\n  });\n\n  it('should handle products with extreme quantity values', async () => {\n    // Arrange\n    const productsWithExtremeQuantities = [\n      {\n        id: '1',\n        name: 'Out of Stock',\n        description: 'Product with zero quantity',\n        price: 19.99,\n        quantity_in_stock: 0,\n        batch: 'ZERO1',\n        created_at: new Date(),\n        updated_at: new Date()\n      },\n      {\n        id: '2',\n        name: 'High Stock',\n        description: 'Product with very high quantity',\n        price: 9.99,\n        quantity_in_stock: 1000000,\n        batch: 'HIGHQ1',\n        created_at: new Date(),\n        updated_at: new Date()\n      }\n    ];\n\n    mockFetchAllProductService.execute.mockResolvedValue({\n      product: productsWithExtremeQuantities\n    });\n\n    // Act\n    await fetchAllProduct(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.send).toHaveBeenCalledWith({\n      product: productsWithExtremeQuantities\n    });\n  });\n});"},"src/http/controllers/manager/create.test.ts":{"tests":[{"id":"151","name":"createManager Controller should create a manager successfully"},{"id":"152","name":"createManager Controller should return 409 when user already exists"},{"id":"153","name":"createManager Controller should throw ZodError when validation fails"},{"id":"154","name":"createManager Controller should throw error when password is too short"},{"id":"155","name":"createManager Controller should throw error when required fields are missing"},{"id":"156","name":"createManager Controller should rethrow unexpected errors"},{"id":"157","name":"createManager Controller should handle empty request body"},{"id":"158","name":"createManager Controller - Edge Cases should handle valid standard emails"},{"id":"159","name":"createManager Controller - Edge Cases should reject invalid international emails"},{"id":"160","name":"createManager Controller - Edge Cases should handle long names and passwords"},{"id":"161","name":"createManager Controller - Edge Cases should always return fixed message for UserAlreadyExistsError"},{"id":"162","name":"createManager Controller - Edge Cases should handle multiple UserAlreadyExistsError instances"},{"id":"163","name":"createManager Controller - Edge Cases should not catch other custom errors"},{"id":"164","name":"createManager Controller - Edge Cases should validate that service is not called when validation fails"},{"id":"165","name":"createManager Controller - Edge Cases should handle managers with special characters in names"},{"id":"166","name":"createManager Controller - Edge Cases should handle different password scenarios"}],"source":"// tests/unit/controllers/manager/create.test.ts\n\nimport { describe, it, expect, beforeEach, afterEach, vi } from 'vitest';\nimport { FastifyReply, FastifyRequest } from 'fastify';\nimport { z } from 'zod';\nimport { createManager } from '../../../../src/http/controllers/manager/create';\nimport { makeCreateManagerService } from '../../../../src/services/factories/manager/make-create-manager-service';\nimport { UserAlreadyExistsError } from '../../../../src/services/errors/user-already-exists-error';\n\n// Mock das dependências\nvi.mock('../../../../src/services/factories/manager/make-create-manager-service');\n\nconst mockMakeCreateManagerService = vi.mocked(makeCreateManagerService);\n\ndescribe('createManager Controller', () => {\n  let mockRequest: Partial<"+"FastifyRequest>;\n  let mockReply: Partial<"+"FastifyReply>;\n  let mockCreateManagerService: {\n    execute: vi.MockedFunction<"+"any>;\n  };\n\n  beforeEach(() => {\n    mockRequest = {\n      body: {\n        name: 'John Manager',\n        email: 'john.manager@example.com',\n        password: '123456'\n      }\n    };\n\n    mockReply = {\n      status: vi.fn().mockReturnThis(),\n      send: vi.fn().mockReturnThis()\n    };\n\n    mockCreateManagerService = {\n      execute: vi.fn()\n    };\n\n    mockMakeCreateManagerService.mockReturnValue(mockCreateManagerService as any);\n  });\n\n  afterEach(() => {\n    vi.clearAllMocks();\n  });\n\n  it('should create a manager successfully', async () => {\n    // Arrange\n    mockCreateManagerService.execute.mockResolvedValue(undefined);\n\n    // Act\n    await createManager(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockMakeCreateManagerService).toHaveBeenCalledOnce();\n    expect(mockCreateManagerService.execute).toHaveBeenCalledWith({\n      name: 'John Manager',\n      email: 'john.manager@example.com',\n      password: '123456'\n    });\n    expect(mockReply.status).toHaveBeenCalledWith(201);\n    expect(mockReply.send).toHaveBeenCalledWith();\n  });\n\n  it('should return 409 when user already exists', async () => {\n    // Arrange\n    mockCreateManagerService.execute.mockRejectedValue(\n      new UserAlreadyExistsError() // Mensagem fixa \"E-mail already exists.\"\n    );\n\n    // Act\n    await createManager(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.status).toHaveBeenCalledWith(409);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      message: 'E-mail already exists.'\n    });\n  });\n\n  it('should throw ZodError when validation fails', async () => {\n    // Arrange\n    mockRequest.body = {\n      name: 'John Manager',\n      email: 'invalid-email', // Email inválido\n      password: '123456'\n    };\n\n    // Act & Assert\n    await expect(\n      createManager(mockRequest as FastifyRequest, mockReply as FastifyReply)\n    ).rejects.toThrow(z.ZodError);\n  });\n\n  it('should throw error when password is too short', async () => {\n    // Arrange\n    mockRequest.body = {\n      name: 'John Manager',\n      email: 'john.manager@example.com',\n      password: '123' // Senha muito curta\n    };\n\n    // Act & Assert\n    await expect(\n      createManager(mockRequest as FastifyRequest, mockReply as FastifyReply)\n    ).rejects.toThrow(z.ZodError);\n  });\n\n  it('should throw error when required fields are missing', async () => {\n    // Arrange\n    mockRequest.body = {\n      // Campos obrigatórios faltando\n    };\n\n    // Act & Assert\n    await expect(\n      createManager(mockRequest as FastifyRequest, mockReply as FastifyReply)\n    ).rejects.toThrow(z.ZodError);\n  });\n\n  it('should rethrow unexpected errors', async () => {\n    // Arrange\n    const unexpectedError = new Error('Database connection failed');\n    mockCreateManagerService.execute.mockRejectedValue(unexpectedError);\n\n    // Act & Assert\n    await expect(\n      createManager(mockRequest as FastifyRequest, mockReply as FastifyReply)\n    ).rejects.toThrow('Database connection failed');\n    \n    // Verifica que não foi chamado o status 409\n    expect(mockReply.status).not.toHaveBeenCalledWith(409);\n  });\n\n  it('should handle empty request body', async () => {\n    // Arrange\n    mockRequest.body = undefined;\n\n    // Act & Assert\n    await expect(\n      createManager(mockRequest as FastifyRequest, mockReply as FastifyReply)\n    ).rejects.toThrow();\n  });\n});\n\n// Testes adicionais para casos específicos\ndescribe('createManager Controller - Edge Cases', () => {\n  let mockRequest: Partial<"+"FastifyRequest>;\n  let mockReply: Partial<"+"FastifyReply>;\n  let mockCreateManagerService: {\n    execute: vi.MockedFunction<"+"any>;\n  };\n\n  beforeEach(() => {\n    mockReply = {\n      status: vi.fn().mockReturnThis(),\n      send: vi.fn().mockReturnThis()\n    };\n\n    mockCreateManagerService = {\n      execute: vi.fn()\n    };\n\n    mockMakeCreateManagerService.mockReturnValue(mockCreateManagerService as any);\n  });\n\n  afterEach(() => {\n    vi.clearAllMocks();\n  });\n\n  it('should handle valid standard emails', async () => {\n    // Arrange - emails padrão válidos\n    const validEmails = [\n      'manager.user@example.com',\n      'manager_user@company.org',\n      'user.name@subdomain.example.co.uk',\n      'manager+tag@example.com'\n    ];\n\n    for (const email of validEmails) {\n      mockRequest = {\n        body: {\n          name: 'Test Manager',\n          email: email,\n          password: '123456'\n        }\n      };\n\n      mockCreateManagerService.execute.mockResolvedValue(undefined);\n\n      // Act & Assert - não deve lançar erro de validação\n      await expect(\n        createManager(mockRequest as FastifyRequest, mockReply as FastifyReply)\n      ).resolves.not.toThrow();\n\n      // Reset do mock para o próximo teste\n      mockCreateManagerService.execute.mockClear();\n      vi.clearAllMocks();\n    }\n  });\n\n  it('should reject invalid international emails', async () => {\n    // Arrange - emails que o Zod provavelmente rejeitará\n    const invalidInternationalEmails = [\n      'josé.manager@empresa.com.br', // Caracteres acentuados no local-part\n      'müller@example.de', // Caracteres especiais no local-part\n      'manager@例子.com', // Domínio internacionalizado\n      '用户@例子.中国' // Domínio internacionalizado\n    ];\n\n    for (const email of invalidInternationalEmails) {\n      mockRequest = {\n        body: {\n          name: 'Test Manager',\n          email: email,\n          password: '123456'\n        }\n      };\n\n      // Act & Assert - deve lançar erro de validação do Zod\n      await expect(\n        createManager(mockRequest as FastifyRequest, mockReply as FastifyReply)\n      ).rejects.toThrow(z.ZodError);\n\n      // Reset para o próximo teste\n      vi.clearAllMocks();\n    }\n  });\n\n  it('should handle long names and passwords', async () => {\n    // Arrange\n    const longName = 'A'.repeat(100);\n    const longPassword = 'B'.repeat(50);\n    \n    mockRequest = {\n      body: {\n        name: longName,\n        email: 'manager@example.com',\n        password: longPassword\n      }\n    };\n\n    mockCreateManagerService.execute.mockResolvedValue(undefined);\n\n    // Act\n    await createManager(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockCreateManagerService.execute).toHaveBeenCalledWith({\n      name: longName,\n      email: 'manager@example.com',\n      password: longPassword\n    });\n  });\n\n  it('should always return fixed message for UserAlreadyExistsError', async () => {\n    // Arrange\n    mockRequest = {\n      body: {\n        name: 'John Manager',\n        email: 'existing@example.com',\n        password: '123456'\n      }\n    };\n\n    mockCreateManagerService.execute.mockRejectedValue(\n      new UserAlreadyExistsError() // Sem mensagem customizada - usa a fixa\n    );\n\n    // Act\n    await createManager(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert - deve sempre retornar a mensagem fixa da classe\n    expect(mockReply.status).toHaveBeenCalledWith(409);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      message: 'E-mail already exists.'\n    });\n  });\n\n  it('should handle multiple UserAlreadyExistsError instances', async () => {\n    // Arrange\n    mockRequest = {\n      body: {\n        name: 'Jane Manager',\n        email: 'jane.manager@example.com',\n        password: '123456'\n      }\n    };\n\n    // Simula múltiplas instâncias do erro (todas com a mesma mensagem fixa)\n    const errorInstances = [\n      new UserAlreadyExistsError(),\n      new UserAlreadyExistsError(),\n      new UserAlreadyExistsError()\n    ];\n\n    for (const errorInstance of errorInstances) {\n      mockCreateManagerService.execute.mockRejectedValue(errorInstance);\n\n      // Act\n      await createManager(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n      // Assert - mensagem sempre fixa\n      expect(mockReply.send).toHaveBeenCalledWith({\n        message: 'E-mail already exists.'\n      });\n\n      // Reset para o próximo teste\n      vi.clearAllMocks();\n    }\n  });\n\n  it('should not catch other custom errors', async () => {\n    // Arrange - Simulando outros erros personalizados que não devem ser tratados\n    class OtherCustomError extends Error {\n      constructor() {\n        super('Other custom error');\n      }\n    }\n\n    mockRequest = {\n      body: {\n        name: 'Test Manager',\n        email: 'test.manager@example.com',\n        password: '123456'\n      }\n    };\n\n    mockCreateManagerService.execute.mockRejectedValue(\n      new OtherCustomError()\n    );\n\n    // Act & Assert - deve rejeitar com o erro original\n    await expect(\n      createManager(mockRequest as FastifyRequest, mockReply as FastifyReply)\n    ).rejects.toThrow('Other custom error');\n  });\n\n  it('should validate that service is not called when validation fails', async () => {\n    // Arrange - casos onde a validação deve falhar\n    const invalidCases = [\n      { body: undefined }, // body undefined\n      { body: {} }, // campos obrigatórios faltando\n      { body: { name: 'Manager', email: 'invalid-email', password: '123456' } }, // email inválido\n      { body: { name: 'Manager', email: 'manager@example.com', password: '123' } } // senha muito curta\n    ];\n\n    for (const invalidCase of invalidCases) {\n      mockRequest.body = invalidCase.body;\n\n      // Act & Assert - deve lançar erro antes de chamar o serviço\n      await expect(\n        createManager(mockRequest as FastifyRequest, mockReply as FastifyReply)\n      ).rejects.toThrow();\n\n      // Assert - serviço não deve ser chamado\n      expect(mockCreateManagerService.execute).not.toHaveBeenCalled();\n\n      // Reset para próximo teste\n      vi.clearAllMocks();\n    }\n  });\n\n  it('should handle managers with special characters in names', async () => {\n    // Arrange\n    mockRequest = {\n      body: {\n        name: 'José Silva Manager',\n        email: 'jose.silva@example.com', // Email válido\n        password: '123456'\n      }\n    };\n\n    mockCreateManagerService.execute.mockResolvedValue(undefined);\n\n    // Act\n    await createManager(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockCreateManagerService.execute).toHaveBeenCalledWith({\n      name: 'José Silva Manager',\n      email: 'jose.silva@example.com',\n      password: '123456'\n    });\n  });\n\n  it('should handle different password scenarios', async () => {\n    // Arrange - testando diferentes cenários de senha válida\n    const passwordScenarios = [\n      '123456', // mínimo\n      'password123',\n      'P@ssw0rd!',\n      'a'.repeat(100) // senha longa\n    ];\n\n    for (const password of passwordScenarios) {\n      mockRequest = {\n        body: {\n          name: 'Test Manager',\n          email: 'test.manager@example.com',\n          password: password\n        }\n      };\n\n      mockCreateManagerService.execute.mockResolvedValue(undefined);\n\n      // Act & Assert - deve criar com sucesso\n      await expect(\n        createManager(mockRequest as FastifyRequest, mockReply as FastifyReply)\n      ).resolves.not.toThrow();\n\n      // Reset para próximo teste\n      vi.clearAllMocks();\n    }\n  });\n});"},"src/http/controllers/manager/fetch-all.test.ts":{"tests":[{"id":"167","name":"fetchAllManagers Controller should return all managers successfully"},{"id":"168","name":"fetchAllManagers Controller should return empty array when no managers exist"},{"id":"169","name":"fetchAllManagers Controller should handle service errors and return 500"},{"id":"170","name":"fetchAllManagers Controller should handle unexpected errors gracefully"},{"id":"171","name":"fetchAllManagers Controller should handle large number of managers"},{"id":"172","name":"fetchAllManagers Controller - Edge Cases should handle managers with special characters in names"},{"id":"173","name":"fetchAllManagers Controller - Edge Cases should handle managers with different email formats"},{"id":"174","name":"fetchAllManagers Controller - Edge Cases should handle service returning null or undefined managers"},{"id":"175","name":"fetchAllManagers Controller - Edge Cases should log different types of errors correctly"},{"id":"176","name":"fetchAllManagers Controller - Edge Cases should handle managers with minimal data"},{"id":"177","name":"fetchAllManagers Controller - Edge Cases should handle single manager in array"},{"id":"178","name":"fetchAllManagers Controller - Edge Cases should preserve manager data structure"}],"source":"// tests/unit/controllers/manager/fetch-all.test.ts\n\nimport { describe, it, expect, beforeEach, afterEach, vi } from 'vitest';\nimport { FastifyReply, FastifyRequest } from 'fastify';\nimport { fetchAllManagers } from '../../../../src/http/controllers/manager/fetch-all';\nimport { makeFetchAllManagersService } from '../../../../src/services/factories/manager/make-fetch-all-managers-serive';\n\n// Mock das dependências\nvi.mock('../../../../src/services/factories/manager/make-fetch-all-managers-serive');\n\nconst mockMakeFetchAllManagersService = vi.mocked(makeFetchAllManagersService);\n\ndescribe('fetchAllManagers Controller', () => {\n  let mockRequest: Partial<"+"FastifyRequest>;\n  let mockReply: Partial<"+"FastifyReply>;\n  let mockFetchAllManagersService: {\n    execute: vi.MockedFunction<"+"any>;\n  };\n\n  beforeEach(() => {\n    mockRequest = {\n      // Request vazio pois não há parâmetros, query ou body\n    };\n\n    mockReply = {\n      status: vi.fn().mockReturnThis(),\n      send: vi.fn().mockReturnThis()\n    };\n\n    mockFetchAllManagersService = {\n      execute: vi.fn()\n    };\n\n    mockMakeFetchAllManagersService.mockReturnValue(mockFetchAllManagersService as any);\n  });\n\n  afterEach(() => {\n    vi.clearAllMocks();\n  });\n\n  it('should return all managers successfully', async () => {\n    // Arrange\n    const mockManagers = [\n      {\n        id: '1',\n        name: 'John Manager',\n        email: 'john.manager@example.com',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      },\n      {\n        id: '2',\n        name: 'Jane Manager',\n        email: 'jane.manager@example.com',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      }\n    ];\n\n    mockFetchAllManagersService.execute.mockResolvedValue({\n      managers: mockManagers\n    });\n\n    // Act\n    await fetchAllManagers(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockMakeFetchAllManagersService).toHaveBeenCalledOnce();\n    expect(mockFetchAllManagersService.execute).toHaveBeenCalledOnce();\n    expect(mockReply.status).toHaveBeenCalledWith(200);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      managers: mockManagers\n    });\n  });\n\n  it('should return empty array when no managers exist', async () => {\n    // Arrange\n    mockFetchAllManagersService.execute.mockResolvedValue({\n      managers: []\n    });\n\n    // Act\n    await fetchAllManagers(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.status).toHaveBeenCalledWith(200);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      managers: []\n    });\n  });\n\n  it('should handle service errors and return 500', async () => {\n    // Arrange\n    const consoleSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n    const serviceError = new Error('Database connection failed');\n    \n    mockFetchAllManagersService.execute.mockRejectedValue(serviceError);\n\n    // Act\n    await fetchAllManagers(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.status).toHaveBeenCalledWith(500);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      message: 'Internal Server Error'\n    });\n    expect(consoleSpy).toHaveBeenCalledWith(serviceError);\n    \n    // Cleanup\n    consoleSpy.mockRestore();\n  });\n\n  it('should handle unexpected errors gracefully', async () => {\n    // Arrange\n    const consoleSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n    const unexpectedError = new TypeError('Unexpected type error');\n    \n    mockFetchAllManagersService.execute.mockRejectedValue(unexpectedError);\n\n    // Act\n    await fetchAllManagers(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.status).toHaveBeenCalledWith(500);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      message: 'Internal Server Error'\n    });\n    expect(consoleSpy).toHaveBeenCalledWith(unexpectedError);\n    \n    // Cleanup\n    consoleSpy.mockRestore();\n  });\n\n  it('should handle large number of managers', async () => {\n    // Arrange\n    const largeManagerList = Array.from({ length: 1000 }, (_, index) => ({\n      id: `${index + 1}`,\n      name: `Manager ${index + 1}`,\n      email: `manager${index + 1}@example.com`,\n      createdAt: new Date(),\n      updatedAt: new Date()\n    }));\n\n    mockFetchAllManagersService.execute.mockResolvedValue({\n      managers: largeManagerList\n    });\n\n    // Act\n    await fetchAllManagers(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.status).toHaveBeenCalledWith(200);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      managers: largeManagerList\n    });\n    expect(largeManagerList).toHaveLength(1000);\n  });\n});\n\n// Testes adicionais para casos específicos\ndescribe('fetchAllManagers Controller - Edge Cases', () => {\n  let mockRequest: Partial<"+"FastifyRequest>;\n  let mockReply: Partial<"+"FastifyReply>;\n  let mockFetchAllManagersService: {\n    execute: vi.MockedFunction<"+"any>;\n  };\n\n  beforeEach(() => {\n    mockRequest = {};\n    mockReply = {\n      status: vi.fn().mockReturnThis(),\n      send: vi.fn().mockReturnThis()\n    };\n    mockFetchAllManagersService = {\n      execute: vi.fn()\n    };\n    mockMakeFetchAllManagersService.mockReturnValue(mockFetchAllManagersService as any);\n  });\n\n  afterEach(() => {\n    vi.clearAllMocks();\n  });\n\n  it('should handle managers with special characters in names', async () => {\n    // Arrange\n    const managersWithSpecialChars = [\n      {\n        id: '1',\n        name: 'José Silva',\n        email: 'jose.silva@example.com',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      },\n      {\n        id: '2',\n        name: 'Müller Schmidt',\n        email: 'muller.schmidt@example.com',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      },\n      {\n        id: '3',\n        name: 'Ana María López',\n        email: 'ana.lopez@example.com',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      }\n    ];\n\n    mockFetchAllManagersService.execute.mockResolvedValue({\n      managers: managersWithSpecialChars\n    });\n\n    // Act\n    await fetchAllManagers(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.send).toHaveBeenCalledWith({\n      managers: managersWithSpecialChars\n    });\n  });\n\n  it('should handle managers with different email formats', async () => {\n    // Arrange\n    const managersWithVariousEmails = [\n      {\n        id: '1',\n        name: 'Manager One',\n        email: 'manager.one+tag@subdomain.example.co.uk',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      },\n      {\n        id: '2',\n        name: 'Manager Two',\n        email: 'manager_two@company.org',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      },\n      {\n        id: '3',\n        name: 'Manager Three',\n        email: 'simple@example.com',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      }\n    ];\n\n    mockFetchAllManagersService.execute.mockResolvedValue({\n      managers: managersWithVariousEmails\n    });\n\n    // Act\n    await fetchAllManagers(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.send).toHaveBeenCalledWith({\n      managers: managersWithVariousEmails\n    });\n  });\n\n  it('should handle service returning null or undefined managers', async () => {\n    // Arrange\n    mockFetchAllManagersService.execute.mockResolvedValue({\n      managers: null\n    });\n\n    // Act\n    await fetchAllManagers(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.status).toHaveBeenCalledWith(200);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      managers: null\n    });\n  });\n\n  it('should log different types of errors correctly', async () => {\n    // Arrange\n    const consoleSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n    \n    const errorTypes = [\n      new Error('Generic error'),\n      new TypeError('Type error'),\n      new RangeError('Range error'),\n      { customError: 'Custom error object' },\n      'String error'\n    ];\n\n    for (const error of errorTypes) {\n      mockFetchAllManagersService.execute.mockRejectedValue(error);\n\n      // Act\n      await fetchAllManagers(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n      // Assert - sempre deve retornar 500\n      expect(mockReply.status).toHaveBeenCalledWith(500);\n      expect(mockReply.send).toHaveBeenCalledWith({\n        message: 'Internal Server Error'\n      });\n\n      // Verifica que o erro foi logado\n      expect(consoleSpy).toHaveBeenCalledWith(error);\n\n      // Reset para próximo teste\n      vi.clearAllMocks();\n    }\n\n    // Cleanup\n    consoleSpy.mockRestore();\n  });\n\n  it('should handle managers with minimal data', async () => {\n    // Arrange\n    const minimalManagers = [\n      {\n        id: '1',\n        name: 'M',\n        email: 'a@b.co',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      }\n    ];\n\n    mockFetchAllManagersService.execute.mockResolvedValue({\n      managers: minimalManagers\n    });\n\n    // Act\n    await fetchAllManagers(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.send).toHaveBeenCalledWith({\n      managers: minimalManagers\n    });\n  });\n\n  it('should handle single manager in array', async () => {\n    // Arrange\n    const singleManager = [\n      {\n        id: '1',\n        name: 'Solo Manager',\n        email: 'solo.manager@example.com',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      }\n    ];\n\n    mockFetchAllManagersService.execute.mockResolvedValue({\n      managers: singleManager\n    });\n\n    // Act\n    await fetchAllManagers(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.send).toHaveBeenCalledWith({\n      managers: singleManager\n    });\n    expect(singleManager).toHaveLength(1);\n  });\n\n  it('should preserve manager data structure', async () => {\n    // Arrange\n    const managersWithCompleteData = [\n      {\n        id: '1',\n        name: 'Complete Manager',\n        email: 'complete@example.com',\n        createdAt: new Date('2023-01-01'),\n        updatedAt: new Date('2023-01-02'),\n        // Outros campos que podem existir\n        role: 'manager',\n        isActive: true\n      }\n    ];\n\n    mockFetchAllManagersService.execute.mockResolvedValue({\n      managers: managersWithCompleteData\n    });\n\n    // Act\n    await fetchAllManagers(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.send).toHaveBeenCalledWith({\n      managers: managersWithCompleteData\n    });\n    // Verifica se a estrutura de dados é preservada\n    expect(mockReply.send).toHaveBeenCalledWith(\n      expect.objectContaining({\n        managers: expect.arrayContaining([\n          expect.objectContaining({\n            id: expect.any(String),\n            name: expect.any(String),\n            email: expect.any(String),\n            createdAt: expect.any(Date),\n            updatedAt: expect.any(Date)\n          })\n        ])\n      })\n    );\n  });\n});"},"src/http/controllers/employee/create.test.ts":{"tests":[{"id":"179","name":"createEmployee Controller should create an employee successfully"},{"id":"180","name":"createEmployee Controller should return 409 when user already exists"},{"id":"181","name":"createEmployee Controller should throw error when validation fails with invalid email"},{"id":"182","name":"createEmployee Controller should throw error when password is too short"},{"id":"183","name":"createEmployee Controller should throw error when required fields are missing"},{"id":"184","name":"createEmployee Controller should rethrow unexpected errors"},{"id":"185","name":"createEmployee Controller should handle empty request body"},{"id":"186","name":"createEmployee Controller - Edge Cases should handle valid standard emails"},{"id":"187","name":"createEmployee Controller - Edge Cases should reject invalid international emails"},{"id":"188","name":"createEmployee Controller - Edge Cases should handle long names and passwords"},{"id":"189","name":"createEmployee Controller - Edge Cases should always return fixed message for UserAlreadyExistsError"},{"id":"190","name":"createEmployee Controller - Edge Cases should handle multiple UserAlreadyExistsError instances"}],"source":"// tests/unit/controllers/employee/create.test.ts\n\nimport { describe, it, expect, beforeEach, afterEach, vi } from 'vitest';\nimport { FastifyReply, FastifyRequest } from 'fastify';\nimport { createEmployee } from '../../../../src/http/controllers/employee/create';\nimport { makeCreateEmployeeService } from '../../../../src/services/factories/employee/make-create-employee-service';\nimport { UserAlreadyExistsError } from '../../../../src/services/errors/user-already-exists-error';\nimport { z } from 'zod';\n\n// Mock das dependências\nvi.mock('../../../../src/services/factories/employee/make-create-employee-service');\n\nconst mockMakeCreateEmployeeService = vi.mocked(makeCreateEmployeeService);\n\ndescribe('createEmployee Controller', () => {\n  let mockRequest: Partial<"+"FastifyRequest>;\n  let mockReply: Partial<"+"FastifyReply>;\n  let mockCreateEmployeeService: {\n    execute: vi.MockedFunction<"+"any>;\n  };\n\n  beforeEach(() => {\n    mockRequest = {\n      body: {\n        name: 'John Doe',\n        email: 'john.doe@example.com',\n        password: '123456'\n      }\n    };\n\n    mockReply = {\n      status: vi.fn().mockReturnThis(),\n      send: vi.fn().mockReturnThis()\n    };\n\n    mockCreateEmployeeService = {\n      execute: vi.fn()\n    };\n\n    mockMakeCreateEmployeeService.mockReturnValue(mockCreateEmployeeService as any);\n  });\n\n  afterEach(() => {\n    vi.clearAllMocks();\n  });\n\n  it('should create an employee successfully', async () => {\n    // Arrange\n    mockCreateEmployeeService.execute.mockResolvedValue(undefined);\n\n    // Act\n    await createEmployee(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockMakeCreateEmployeeService).toHaveBeenCalledOnce();\n    expect(mockCreateEmployeeService.execute).toHaveBeenCalledWith({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password: '123456'\n    });\n    expect(mockReply.status).toHaveBeenCalledWith(201);\n    expect(mockReply.send).toHaveBeenCalledWith();\n  });\n\n  it('should return 409 when user already exists', async () => {\n    // Arrange\n    mockCreateEmployeeService.execute.mockRejectedValue(\n      new UserAlreadyExistsError()\n    );\n\n    // Act\n    await createEmployee(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.status).toHaveBeenCalledWith(409);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      message: 'E-mail already exists.'\n    });\n  });\n\n  it('should throw error when validation fails with invalid email', async () => {\n    // Arrange\n    mockRequest.body = {\n      name: 'John Doe',\n      email: 'invalid-email', // Email inválido\n      password: '123456'\n    };\n\n    // Act & Assert\n    await expect(\n      createEmployee(mockRequest as FastifyRequest, mockReply as FastifyReply)\n    ).rejects.toThrow(z.ZodError);\n  });\n\n  it('should throw error when password is too short', async () => {\n    // Arrange\n    mockRequest.body = {\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password: '123' // Senha muito curta\n    };\n\n    // Act & Assert\n    await expect(\n      createEmployee(mockRequest as FastifyRequest, mockReply as FastifyReply)\n    ).rejects.toThrow(z.ZodError);\n  });\n\n  it('should throw error when required fields are missing', async () => {\n    // Arrange\n    mockRequest.body = {\n      // Campos obrigatórios faltando\n    };\n\n    // Act & Assert\n    await expect(\n      createEmployee(mockRequest as FastifyRequest, mockReply as FastifyReply)\n    ).rejects.toThrow(z.ZodError);\n  });\n\n  it('should rethrow unexpected errors', async () => {\n    // Arrange\n    const unexpectedError = new Error('Database connection failed');\n    mockCreateEmployeeService.execute.mockRejectedValue(unexpectedError);\n\n    // Act & Assert\n    await expect(\n      createEmployee(mockRequest as FastifyRequest, mockReply as FastifyReply)\n    ).rejects.toThrow('Database connection failed');\n    \n    // Verifica que não foi chamado o status 409\n    expect(mockReply.status).not.toHaveBeenCalledWith(409);\n  });\n\n  it('should handle empty request body', async () => {\n    // Arrange\n    mockRequest.body = undefined;\n\n    // Act & Assert\n    await expect(\n      createEmployee(mockRequest as FastifyRequest, mockReply as FastifyReply)\n    ).rejects.toThrow();\n  });\n});\n\n// Testes adicionais para casos específicos\ndescribe('createEmployee Controller - Edge Cases', () => {\n  let mockRequest: Partial<"+"FastifyRequest>;\n  let mockReply: Partial<"+"FastifyReply>;\n  let mockCreateEmployeeService: {\n    execute: vi.MockedFunction<"+"any>;\n  };\n\n  beforeEach(() => {\n    mockReply = {\n      status: vi.fn().mockReturnThis(),\n      send: vi.fn().mockReturnThis()\n    };\n\n    mockCreateEmployeeService = {\n      execute: vi.fn()\n    };\n\n    mockMakeCreateEmployeeService.mockReturnValue(mockCreateEmployeeService as any);\n  });\n\n  afterEach(() => {\n    vi.clearAllMocks();\n  });\n\n  it('should handle valid standard emails', async () => {\n    // Arrange - emails padrão válidos que o Zod aceita\n    const validEmails = [\n      'test.user@example.com',\n      'test_user@company.org',\n      'user.name@subdomain.example.co.uk',\n      'user+tag@example.com'\n    ];\n\n    for (const email of validEmails) {\n      mockRequest = {\n        body: {\n          name: 'Test User',\n          email: email,\n          password: '123456'\n        }\n      };\n\n      mockCreateEmployeeService.execute.mockResolvedValue(undefined);\n\n      // Act & Assert - não deve lançar erro de validação\n      await expect(\n        createEmployee(mockRequest as FastifyRequest, mockReply as FastifyReply)\n      ).resolves.not.toThrow();\n\n      // Reset do mock para o próximo teste\n      mockCreateEmployeeService.execute.mockClear();\n      vi.clearAllMocks();\n    }\n  });\n\n  it('should reject invalid international emails', async () => {\n    // Arrange - emails que o Zod provavelmente rejeitará\n    const invalidInternationalEmails = [\n      'josé.silva@empresa.com.br', // Caracteres acentuados no local-part\n      'müller@example.de', // Caracteres especiais no local-part\n      'test@例子.com', // Domínio internacionalizado\n      '用户@例子.中国' // Domínio internacionalizado\n    ];\n\n    for (const email of invalidInternationalEmails) {\n      mockRequest = {\n        body: {\n          name: 'Test User',\n          email: email,\n          password: '123456'\n        }\n      };\n\n      // Act & Assert - deve lançar erro de validação do Zod\n      await expect(\n        createEmployee(mockRequest as FastifyRequest, mockReply as FastifyReply)\n      ).rejects.toThrow(z.ZodError);\n\n      // Reset para o próximo teste\n      vi.clearAllMocks();\n    }\n  });\n\n  it('should handle long names and passwords', async () => {\n    // Arrange\n    const longName = 'A'.repeat(100);\n    const longPassword = 'B'.repeat(50);\n    \n    mockRequest = {\n      body: {\n        name: longName,\n        email: 'test@example.com',\n        password: longPassword\n      }\n    };\n\n    mockCreateEmployeeService.execute.mockResolvedValue(undefined);\n\n    // Act\n    await createEmployee(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockCreateEmployeeService.execute).toHaveBeenCalledWith({\n      name: longName,\n      email: 'test@example.com',\n      password: longPassword\n    });\n  });\n\n  it('should always return fixed message for UserAlreadyExistsError', async () => {\n    // Arrange\n    mockRequest = {\n      body: {\n        name: 'John Doe',\n        email: 'existing@example.com',\n        password: '123456'\n      }\n    };\n\n    mockCreateEmployeeService.execute.mockRejectedValue(\n      new UserAlreadyExistsError() // Sem mensagem customizada\n    );\n\n    // Act\n    await createEmployee(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert - deve sempre retornar a mensagem fixa da classe\n    expect(mockReply.status).toHaveBeenCalledWith(409);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      message: 'E-mail already exists.'\n    });\n  });\n\n  it('should handle multiple UserAlreadyExistsError instances', async () => {\n    // Arrange\n    mockRequest = {\n      body: {\n        name: 'Jane Doe',\n        email: 'jane@example.com',\n        password: '123456'\n      }\n    };\n\n    // Simula múltiplas instâncias do erro (todas com a mesma mensagem fixa)\n    const errorInstances = [\n      new UserAlreadyExistsError(),\n      new UserAlreadyExistsError(),\n      new UserAlreadyExistsError()\n    ];\n\n    for (const errorInstance of errorInstances) {\n      mockCreateEmployeeService.execute.mockRejectedValue(errorInstance);\n\n      // Act\n      await createEmployee(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n      // Assert - mensagem sempre fixa\n      expect(mockReply.send).toHaveBeenCalledWith({\n        message: 'E-mail already exists.'\n      });\n\n      // Reset para o próximo teste\n      vi.clearAllMocks();\n    }\n  });\n});"},"src/http/controllers/employee/fetch-all.test.ts":{"tests":[{"id":"191","name":"fetchAllEmployees Controller should return all employees successfully"},{"id":"192","name":"fetchAllEmployees Controller should return empty array when no employees exist"},{"id":"193","name":"fetchAllEmployees Controller should handle service errors and return 500"},{"id":"194","name":"fetchAllEmployees Controller should handle unexpected errors gracefully"},{"id":"195","name":"fetchAllEmployees Controller should handle large number of employees"},{"id":"196","name":"fetchAllEmployees Controller - Edge Cases should handle employees with special characters in names"},{"id":"197","name":"fetchAllEmployees Controller - Edge Cases should handle employees with different email formats"},{"id":"198","name":"fetchAllEmployees Controller - Edge Cases should handle service returning null or undefined employees"},{"id":"199","name":"fetchAllEmployees Controller - Edge Cases should log different types of errors correctly"}],"source":"// tests/unit/controllers/employee/fetch-all.test.ts\n\nimport { describe, it, expect, beforeEach, afterEach, vi } from 'vitest';\nimport { FastifyReply, FastifyRequest } from 'fastify';\nimport { fetchAllEmployees } from '../../../../src/http/controllers/employee/fetch-all';\nimport { makeFetchAllEmployeesService } from '../../../../src/services/factories/employee/make-fetch-all-employees-service';\n\n// Mock das dependências\nvi.mock('../../../../src/services/factories/employee/make-fetch-all-employees-service');\n\nconst mockMakeFetchAllEmployeesService = vi.mocked(makeFetchAllEmployeesService);\n\ndescribe('fetchAllEmployees Controller', () => {\n  let mockRequest: Partial<"+"FastifyRequest>;\n  let mockReply: Partial<"+"FastifyReply>;\n  let mockFetchAllEmployeeService: {\n    execute: vi.MockedFunction<"+"any>;\n  };\n\n  beforeEach(() => {\n    mockRequest = {\n      // Request vazio pois não há parâmetros, query ou body\n    };\n\n    mockReply = {\n      status: vi.fn().mockReturnThis(),\n      send: vi.fn().mockReturnThis()\n    };\n\n    mockFetchAllEmployeeService = {\n      execute: vi.fn()\n    };\n\n    mockMakeFetchAllEmployeesService.mockReturnValue(mockFetchAllEmployeeService as any);\n  });\n\n  afterEach(() => {\n    vi.clearAllMocks();\n  });\n\n  it('should return all employees successfully', async () => {\n    // Arrange\n    const mockEmployees = [\n      {\n        id: '1',\n        name: 'John Doe',\n        email: 'john.doe@example.com',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      },\n      {\n        id: '2',\n        name: 'Jane Smith',\n        email: 'jane.smith@example.com',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      }\n    ];\n\n    mockFetchAllEmployeeService.execute.mockResolvedValue({\n      employee: mockEmployees\n    });\n\n    // Act\n    await fetchAllEmployees(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockMakeFetchAllEmployeesService).toHaveBeenCalledOnce();\n    expect(mockFetchAllEmployeeService.execute).toHaveBeenCalledOnce();\n    expect(mockReply.status).toHaveBeenCalledWith(200);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      employee: mockEmployees\n    });\n  });\n\n  it('should return empty array when no employees exist', async () => {\n    // Arrange\n    mockFetchAllEmployeeService.execute.mockResolvedValue({\n      employee: []\n    });\n\n    // Act\n    await fetchAllEmployees(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.status).toHaveBeenCalledWith(200);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      employee: []\n    });\n  });\n\n  it('should handle service errors and return 500', async () => {\n    // Arrange\n    const consoleSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n    const serviceError = new Error('Database connection failed');\n    \n    mockFetchAllEmployeeService.execute.mockRejectedValue(serviceError);\n\n    // Act\n    await fetchAllEmployees(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.status).toHaveBeenCalledWith(500);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      message: 'Internal Server Error'\n    });\n    expect(consoleSpy).toHaveBeenCalledWith(serviceError);\n    \n    // Cleanup\n    consoleSpy.mockRestore();\n  });\n\n  it('should handle unexpected errors gracefully', async () => {\n    // Arrange\n    const consoleSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n    const unexpectedError = new TypeError('Unexpected type error');\n    \n    mockFetchAllEmployeeService.execute.mockRejectedValue(unexpectedError);\n\n    // Act\n    await fetchAllEmployees(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.status).toHaveBeenCalledWith(500);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      message: 'Internal Server Error'\n    });\n    expect(consoleSpy).toHaveBeenCalledWith(unexpectedError);\n    \n    // Cleanup\n    consoleSpy.mockRestore();\n  });\n\n  it('should handle large number of employees', async () => {\n    // Arrange\n    const largeEmployeeList = Array.from({ length: 1000 }, (_, index) => ({\n      id: `${index + 1}`,\n      name: `Employee ${index + 1}`,\n      email: `employee${index + 1}@example.com`,\n      createdAt: new Date(),\n      updatedAt: new Date()\n    }));\n\n    mockFetchAllEmployeeService.execute.mockResolvedValue({\n      employee: largeEmployeeList\n    });\n\n    // Act\n    await fetchAllEmployees(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.status).toHaveBeenCalledWith(200);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      employee: largeEmployeeList\n    });\n    expect(largeEmployeeList).toHaveLength(1000);\n  });\n});\n\n// Testes adicionais para casos específicos\ndescribe('fetchAllEmployees Controller - Edge Cases', () => {\n  let mockRequest: Partial<"+"FastifyRequest>;\n  let mockReply: Partial<"+"FastifyReply>;\n  let mockFetchAllEmployeeService: {\n    execute: vi.MockedFunction<"+"any>;\n  };\n\n  beforeEach(() => {\n    mockRequest = {};\n    mockReply = {\n      status: vi.fn().mockReturnThis(),\n      send: vi.fn().mockReturnThis()\n    };\n    mockFetchAllEmployeeService = {\n      execute: vi.fn()\n    };\n    mockMakeFetchAllEmployeesService.mockReturnValue(mockFetchAllEmployeeService as any);\n  });\n\n  afterEach(() => {\n    vi.clearAllMocks();\n  });\n\n  it('should handle employees with special characters in names', async () => {\n    // Arrange\n    const employeesWithSpecialChars = [\n      {\n        id: '1',\n        name: 'José Silva',\n        email: 'jose.silva@example.com',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      },\n      {\n        id: '2',\n        name: 'Müller Schmidt',\n        email: 'muller.schmidt@example.com',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      },\n      {\n        id: '3',\n        name: 'Ana María López',\n        email: 'ana.lopez@example.com',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      }\n    ];\n\n    mockFetchAllEmployeeService.execute.mockResolvedValue({\n      employee: employeesWithSpecialChars\n    });\n\n    // Act\n    await fetchAllEmployees(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.send).toHaveBeenCalledWith({\n      employee: employeesWithSpecialChars\n    });\n  });\n\n  it('should handle employees with different email formats', async () => {\n    // Arrange\n    const employeesWithVariousEmails = [\n      {\n        id: '1',\n        name: 'User One',\n        email: 'user.one+tag@subdomain.example.co.uk',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      },\n      {\n        id: '2',\n        name: 'User Two',\n        email: 'user_two@company.org',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      },\n      {\n        id: '3',\n        name: 'User Three',\n        email: 'simple@example.com',\n        createdAt: new Date(),\n        updatedAt: new Date()\n      }\n    ];\n\n    mockFetchAllEmployeeService.execute.mockResolvedValue({\n      employee: employeesWithVariousEmails\n    });\n\n    // Act\n    await fetchAllEmployees(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.send).toHaveBeenCalledWith({\n      employee: employeesWithVariousEmails\n    });\n  });\n\n  it('should handle service returning null or undefined employees', async () => {\n    // Arrange\n    mockFetchAllEmployeeService.execute.mockResolvedValue({\n      employee: null\n    });\n\n    // Act\n    await fetchAllEmployees(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n    // Assert\n    expect(mockReply.status).toHaveBeenCalledWith(200);\n    expect(mockReply.send).toHaveBeenCalledWith({\n      employee: null\n    });\n  });\n\n  it('should log different types of errors correctly', async () => {\n    // Arrange\n    const consoleSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n    \n    const errorTypes = [\n      new Error('Generic error'),\n      new TypeError('Type error'),\n      new RangeError('Range error'),\n      { customError: 'Custom error object' },\n      'String error'\n    ];\n\n    for (const error of errorTypes) {\n      mockFetchAllEmployeeService.execute.mockRejectedValue(error);\n\n      // Act\n      await fetchAllEmployees(mockRequest as FastifyRequest, mockReply as FastifyReply);\n\n      // Assert - sempre deve retornar 500\n      expect(mockReply.status).toHaveBeenCalledWith(500);\n      expect(mockReply.send).toHaveBeenCalledWith({\n        message: 'Internal Server Error'\n      });\n\n      // Verifica que o erro foi logado\n      expect(consoleSpy).toHaveBeenCalledWith(error);\n\n      // Reset para próximo teste\n      vi.clearAllMocks();\n    }\n\n    // Cleanup\n    consoleSpy.mockRestore();\n  });\n});"},"src/services/sale/create-sale.test.ts":{"tests":[{"id":"200","name":"Create Sale Service should be able to create a new sale"},{"id":"201","name":"Create Sale Service should not be able to create a sale with a non-existing product"},{"id":"202","name":"Create Sale Service should not be able to create a sale with an inactive product"},{"id":"203","name":"Create Sale Service should not be able to create a sale with insufficient stock"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemorySaleRepository } from '../../repositories/in-memory/in-memory-sale-repository';\nimport { InMemoryItemRepository } from '../../repositories/in-memory/in-memory-item-repository';\nimport { InMemoryProductsRepository } from '../../repositories/in-memory/in-memory-products-repository';\nimport { CreateSaleService } from './create-sale';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\n\n// Declaração das variáveis\nlet saleRepository: InMemorySaleRepository;\nlet itemsRepository: InMemoryItemRepository;\nlet productsRepository: InMemoryProductsRepository;\nlet usersRepository: InMemoryUsersRepository;\nlet sut: CreateSaleService; // SUT: System Under Test\n\ndescribe('Create Sale Service', () => {\n  beforeEach(() => {\n    // Instancia os repositórios e o serviço antes de cada teste\n    saleRepository = new InMemorySaleRepository();\n    itemsRepository = new InMemoryItemRepository();\n    productsRepository = new InMemoryProductsRepository();\n    usersRepository = new InMemoryUsersRepository();\n    sut = new CreateSaleService(saleRepository, itemsRepository, productsRepository);\n  });\n\n  it('should be able to create a new sale', async () => {\n    // Arrange: Cria um usuário e produtos com estoque suficiente\n    const user = await usersRepository.create({ id: 'user-01', name: 'John Doe', email: 'john@doe.com', password_hash: '123' });\n    const product1 = await productsRepository.create({ name: 'Product A', price: 10, quantity_in_stock: 20 });\n    const product2 = await productsRepository.create({ name: 'Product B', price: 5, quantity_in_stock: 15 });\n\n    // Act: Executa o serviço de criação de venda\n    const { newSale, items } = await sut.handle({\n      nf_number: 'NF-SALE-001',\n      userId: user.id,\n      items: [\n        { productId: product1.id, quantity: 2, value: 10 },\n        { productId: product2.id, quantity: 3, value: 5 },\n      ],\n    });\n\n    // Assert\n    const updatedProduct1 = await productsRepository.findById(product1.id);\n    const updatedProduct2 = await productsRepository.findById(product2.id);\n\n    // Verifica se a venda e os itens foram criados\n    expect(newSale.id).toEqual(expect.any(String));\n    expect(items).toHaveLength(2);\n    // Verifica se o subtotal foi calculado e atualizado corretamente\n    expect(newSale.subTotal).toEqual((2 * 10) + (3 * 5));\n    // Verifica se o estoque dos produtos foi reduzido\n    expect(updatedProduct1?.quantity_in_stock).toBe(18); // 20 - 2\n    expect(updatedProduct2?.quantity_in_stock).toBe(12); // 15 - 3\n  });\n\n  it('should not be able to create a sale with a non-existing product', async () => {\n    // Arrange\n    const user = await usersRepository.create({ id: 'user-01', name: 'John Doe', email: 'john@doe.com', password_hash: '123' });\n    const product1 = await productsRepository.create({ name: 'Product A', price: 10, quantity_in_stock: 20 });\n\n    // Act & Assert: Tenta criar a venda com um produto que não existe\n    await expect(() =>\n      sut.handle({\n        nf_number: 'NF-FAIL-01',\n        userId: user.id,\n        items: [\n          { productId: product1.id, quantity: 1, value: 10 },\n          { productId: 'non-existing-product-id', quantity: 1, value: 5 },\n        ],\n      })\n    ).rejects.toThrow('Product not found');\n  });\n\n  it('should not be able to create a sale with an inactive product', async () => {\n    // Arrange\n    const user = await usersRepository.create({ id: 'user-01', name: 'John Doe', email: 'john@doe.com', password_hash: '123' });\n    const inactiveProduct = await productsRepository.create({ name: 'Inactive Product', price: 10, quantity_in_stock: 20, is_active: false });\n\n    // Act & Assert\n    await expect(() =>\n      sut.handle({\n        nf_number: 'NF-FAIL-02',\n        userId: user.id,\n        items: [{ productId: inactiveProduct.id, quantity: 1, value: 10 }],\n      })\n    ).rejects.toThrow(`Product ${inactiveProduct.name} is inactive`);\n  });\n\n  it('should not be able to create a sale with insufficient stock', async () => {\n    // Arrange\n    const user = await usersRepository.create({ id: 'user-01', name: 'John Doe', email: 'john@doe.com', password_hash: '123' });\n    const product = await productsRepository.create({ name: 'Limited Stock Product', price: 10, quantity_in_stock: 5 });\n\n    // Act & Assert\n    await expect(() =>\n      sut.handle({\n        nf_number: 'NF-FAIL-03',\n        userId: user.id,\n        items: [{ productId: product.id, quantity: 10, value: 10 }], // Pedindo 10, mas só tem 5\n      })\n    ).rejects.toThrow(`Insufficient stock for product ${product.name}`);\n  });\n});\n"},"src/services/purchase/create-purchase.test.ts":{"tests":[{"id":"204","name":"Create Purchase Service should be able to create a new purchase and increase product stock"},{"id":"205","name":"Create Purchase Service should throw an error if a product is not found"},{"id":"206","name":"Create Purchase Service should throw an error if a product is inactive"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryPurchaseRepository } from '../../repositories/in-memory/in-memory-purchase-repository';\nimport { InMemoryItemRepository } from '../../repositories/in-memory/in-memory-item-repository';\nimport { InMemoryProductsRepository } from '../../repositories/in-memory/in-memory-products-repository';\nimport { CreatePurchaseService } from './create-purchase';\n\n// Declaração das variáveis\nlet purchaseRepository: InMemoryPurchaseRepository;\nlet itemRepository: InMemoryItemRepository;\nlet productRepository: InMemoryProductsRepository;\nlet sut: CreatePurchaseService; // SUT: System Under Test\n\ndescribe('Create Purchase Service', () => {\n  beforeEach(() => {\n    // Instancia os repositórios e o serviço antes de cada teste\n    purchaseRepository = new InMemoryPurchaseRepository();\n    itemRepository = new InMemoryItemRepository();\n    productRepository = new InMemoryProductsRepository();\n    sut = new CreatePurchaseService(purchaseRepository, itemRepository, productRepository);\n  });\n\n  it('should be able to create a new purchase and increase product stock', async () => {\n    // Arrange: Cria produtos que farão parte da compra\n    const product1 = await productRepository.create({\n      name: 'Product A',\n      price: 10,\n      quantity_in_stock: 50,\n    });\n\n    const product2 = await productRepository.create({\n      name: 'Product B',\n      price: 25,\n      quantity_in_stock: 30,\n    });\n\n    // Act: Executa o serviço de criação de compra\n    const { newPurchase, items } = await sut.handle({\n      nf_number: 'NF-12345',\n      supplierId: 'supplier-01',\n      userId: 'user-01',\n      items: [\n        { productId: product1.id, quantity: 10, value: 10 },\n        { productId: product2.id, quantity: 5, value: 25 },\n      ],\n    });\n\n    // Assert\n    // Verifica se a compra e os itens foram criados\n    expect(newPurchase.id).toEqual(expect.any(String));\n    expect(items).toHaveLength(2);\n\n    // Verifica se o subtotal foi calculado e atualizado corretamente\n    // 10 (qtd) * 10 (val) + 5 (qtd) * 25 (val) = 100 + 125 = 225\n    expect(newPurchase.subTotal).toEqual(225);\n\n    // Verifica se o estoque dos produtos foi aumentado\n    const updatedProduct1 = await productRepository.findById(product1.id);\n    const updatedProduct2 = await productRepository.findById(product2.id);\n    expect(updatedProduct1?.quantity_in_stock).toEqual(60); // 50 + 10\n    expect(updatedProduct2?.quantity_in_stock).toEqual(35); // 30 + 5\n  });\n\n  it('should throw an error if a product is not found', async () => {\n    // Arrange\n    const product1 = await productRepository.create({ name: 'Product A', price: 10 });\n\n    // Act & Assert: Tenta criar uma compra com um produto que não existe\n    await expect(() =>\n      sut.handle({\n        nf_number: 'NF-Error',\n        supplierId: 'supplier-01',\n        userId: 'user-01',\n        items: [\n          { productId: product1.id, quantity: 1, value: 10 },\n          { productId: 'non-existing-product-id', quantity: 1, value: 20 },\n        ],\n      })\n    ).rejects.toThrow('Product not found');\n  });\n\n  it('should throw an error if a product is inactive', async () => {\n    // Arrange: Cria um produto e o inativa\n    const product1 = await productRepository.create({ name: 'Inactive Product', price: 10 });\n    await productRepository.inactivate(product1.id);\n\n    // Act & Assert: Tenta criar uma compra com um produto inativo\n    await expect(() =>\n      sut.handle({\n        nf_number: 'NF-Error-Inactive',\n        supplierId: 'supplier-01',\n        userId: 'user-01',\n        items: [{ productId: product1.id, quantity: 1, value: 10 }],\n      })\n    ).rejects.toThrow(`Product ${product1.name} does not exist or is inactive`);\n  });\n});\n"},"src/services/manager/update-manager.test.ts":{"tests":[{"id":"207","name":"Update Manager Service should be able to update a manager"},{"id":"208","name":"Update Manager Service should be able to update a manager with a new password"},{"id":"209","name":"Update Manager Service should throw an error if the user is not found"},{"id":"210","name":"Update Manager Service should throw an error if the manager profile is not found for the user"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryManagersRepository } from '../../repositories/in-memory/in-memory-manager-repository';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\nimport { UpdateManagerService } from './update-manager';\nimport { NoRecordsFoundError } from '../errors/no-records-found-error';\n\n// Declaração das variáveis\nlet managersRepository: InMemoryManagersRepository;\nlet usersRepository: InMemoryUsersRepository;\nlet sut: UpdateManagerService; // SUT: System Under Test\n\ndescribe('Update Manager Service', () => {\n  beforeEach(() => {\n    // Instancia os repositórios e o serviço antes de cada teste\n    managersRepository = new InMemoryManagersRepository();\n    usersRepository = new InMemoryUsersRepository();\n    sut = new UpdateManagerService(managersRepository, usersRepository);\n  });\n\n  it('should be able to update a manager', async () => {\n    // Arrange: Cria um usuário e um gerente para serem atualizados\n    const user = await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'hashed_password_1'\n    });\n\n    await managersRepository.create({\n      user: { connect: { id: user.id } }\n    });\n\n    // Act: Executa o serviço com os novos dados\n    await sut.execute({\n      userId: user.id,\n      name: 'John Doe Updated',\n      email: 'john.doe.updated@example.com',\n    });\n\n    // Assert: Verifica se os dados do usuário foram atualizados no repositório\n    const updatedUser = await usersRepository.findById(user.id);\n    expect(updatedUser?.name).toEqual('John Doe Updated');\n    expect(updatedUser?.email).toEqual('john.doe.updated@example.com');\n  });\n\n  it('should be able to update a manager with a new password', async () => {\n    // Arrange\n    const user = await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'hashed_password_1'\n    });\n\n    await managersRepository.create({\n      user: { connect: { id: user.id } }\n    });\n\n    // Act\n    await sut.execute({\n      userId: user.id,\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password: 'new_password_123',\n    });\n\n    // Assert\n    const updatedUser = await usersRepository.findById(user.id);\n    expect(updatedUser?.password_hash).not.toEqual('hashed_password_1');\n  });\n\n  it('should throw an error if the user is not found', async () => {\n    // Act & Assert: Tenta atualizar um gerente com um userId inexistente\n    await expect(() =>\n      sut.execute({\n        userId: 'non-existing-user-id',\n        name: 'Any Name',\n        email: 'any.email@example.com',\n      })\n    ).rejects.toBeInstanceOf(NoRecordsFoundError);\n  });\n\n  it('should throw an error if the manager profile is not found for the user', async () => {\n    // Arrange: Cria um usuário, mas não um gerente associado a ele\n    const user = await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'hashed_password_1'\n    });\n\n    // Act & Assert: Tenta atualizar, mas o serviço não encontrará o perfil de gerente\n    await expect(() =>\n      sut.execute({\n        userId: user.id,\n        name: 'Any Name',\n        email: 'any.email@example.com',\n      })\n    ).rejects.toBeInstanceOf(NoRecordsFoundError);\n  });\n});\n"},"src/services/purchase/fetch-all-purchase-by-supplier-id.test.ts":{"tests":[{"id":"211","name":"Fetch All Purchase by Supplier Id Service should be able to fetch all purchases from a specific supplier"},{"id":"212","name":"Fetch All Purchase by Supplier Id Service should throw an error if the supplier is not found"},{"id":"213","name":"Fetch All Purchase by Supplier Id Service should return an empty array if the supplier has no purchases"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryPurchaseRepository } from '../../repositories/in-memory/in-memory-purchase-repository';\nimport { InMemorySuppliersRepository } from '../../repositories/in-memory/in-memory-supplier-repository';\nimport { FetchAllPurchaseBySupplierIdService } from './fetch-all-purchase-by-supplier-id';\nimport { ResourceNotFoundError } from '../errors/resource-not-found-error';\n\n// Declaração das variáveis\nlet purchaseRepository: InMemoryPurchaseRepository;\nlet supplierRepository: InMemorySuppliersRepository;\nlet sut: FetchAllPurchaseBySupplierIdService; // SUT: System Under Test\n\ndescribe('Fetch All Purchase by Supplier Id Service', () => {\n  beforeEach(() => {\n    // Instancia os repositórios e o serviço antes de cada teste\n    purchaseRepository = new InMemoryPurchaseRepository();\n    supplierRepository = new InMemorySuppliersRepository();\n    sut = new FetchAllPurchaseBySupplierIdService(purchaseRepository, supplierRepository);\n  });\n\n  it('should be able to fetch all purchases from a specific supplier', async () => {\n    // Arrange: Cria dois fornecedores e compras para ambos\n    const supplier1 = await supplierRepository.create({\n      social_name: 'Supplier One LTDA',\n      company_name: 'Supplier One',\n      cnpj: '11111111111111',\n      phone_number: '111111111'\n    });\n\n    const supplier2 = await supplierRepository.create({\n      social_name: 'Supplier Two LTDA',\n      company_name: 'Supplier Two',\n      cnpj: '22222222222222',\n      phone_number: '222222222'\n    });\n\n    await purchaseRepository.create({\n      nf_number: 'NF-001',\n      supplier: { connect: { id: supplier1.id } },\n      user: { connect: { id: 'user-01' } },\n    });\n\n    await purchaseRepository.create({\n      nf_number: 'NF-002',\n      supplier: { connect: { id: supplier1.id } },\n      user: { connect: { id: 'user-02' } },\n    });\n\n    await purchaseRepository.create({\n      nf_number: 'NF-003',\n      supplier: { connect: { id: supplier2.id } },\n      user: { connect: { id: 'user-01' } },\n    });\n\n    // Act: Executa o serviço buscando as compras do primeiro fornecedor\n    const { purchases } = await sut.execute({ supplierId: supplier1.id });\n\n    // Assert: Verifica se retornou apenas as compras do fornecedor correto\n    expect(purchases).toHaveLength(2);\n    expect(purchases[0].nf_number).toEqual('NF-001');\n    expect(purchases[1].nf_number).toEqual('NF-002');\n  });\n\n  it('should throw an error if the supplier is not found', async () => {\n    // Act & Assert: Tenta buscar compras de um fornecedor inexistente\n    await expect(() =>\n      sut.execute({ supplierId: 'non-existing-supplier-id' })\n    ).rejects.toBeInstanceOf(ResourceNotFoundError);\n  });\n\n  it('should return an empty array if the supplier has no purchases', async () => {\n    // Arrange: Cria um fornecedor mas nenhuma compra para ele\n    const supplier = await supplierRepository.create({\n        social_name: 'Supplier No Purchases LTDA',\n        company_name: 'Supplier No Purchases',\n        cnpj: '33333333333333',\n        phone_number: '333333333'\n    });\n\n    // Act\n    const { purchases } = await sut.execute({ supplierId: supplier.id });\n\n    // Assert\n    expect(purchases).toHaveLength(0);\n  });\n});\n"},"src/services/employee/update-employee.test.ts":{"tests":[{"id":"214","name":"Update Employee Service should be able to update an employee without changing the password"},{"id":"215","name":"Update Employee Service should be able to update an employee including the password"},{"id":"216","name":"Update Employee Service should throw an error if the user is not found"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryEmployeesRepository } from '../../repositories/in-memory/in-memory-employee-repository';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\nimport { UpdateEmployeeService } from './update-employee';\n\n// Declaração das variáveis\nlet employeesRepository: InMemoryEmployeesRepository;\nlet usersRepository: InMemoryUsersRepository;\nlet sut: UpdateEmployeeService; // SUT: System Under Test\n\ndescribe('Update Employee Service', () => {\n  beforeEach(() => {\n    // Instancia os repositórios e o serviço antes de cada teste\n    employeesRepository = new InMemoryEmployeesRepository();\n    usersRepository = new InMemoryUsersRepository();\n    sut = new UpdateEmployeeService(employeesRepository, usersRepository);\n  });\n\n  it('should be able to update an employee without changing the password', async () => {\n    // Arrange: Cria um usuário e um funcionário para o teste\n    const user = await usersRepository.create({\n      name: 'John Doe',\n      email: 'john.doe@example.com',\n      password_hash: 'initial_hashed_password'\n    });\n\n    await employeesRepository.create({\n      user: { connect: { id: user.id } }\n    });\n\n    // Act: Executa o serviço com novos dados, mas sem a senha\n    await sut.execute({\n      userId: user.id,\n      name: 'John Doe Updated',\n      email: 'john.doe.updated@example.com',\n    });\n    \n    // Assert: Verifica se os dados do usuário foram atualizados corretamente\n    const updatedUser = await usersRepository.findById(user.id);\n    expect(updatedUser?.name).toEqual('John Doe Updated');\n    expect(updatedUser?.email).toEqual('john.doe.updated@example.com');\n    // A senha não deve ter sido alterada\n    expect(updatedUser?.password_hash).toEqual('initial_hashed_password');\n  });\n\n  it('should be able to update an employee including the password', async () => {\n    // Arrange\n    const user = await usersRepository.create({\n      name: 'Jane Doe',\n      email: 'jane.doe@example.com',\n      password_hash: 'old_hashed_password'\n    });\n\n    await employeesRepository.create({\n      user: { connect: { id: user.id } }\n    });\n\n    // Act: Executa o serviço com novos dados, incluindo uma nova senha\n    await sut.execute({\n      userId: user.id,\n      name: 'Jane Doe Updated',\n      email: 'jane.doe.updated@example.com',\n      password: 'new_password_123'\n    });\n\n    // Assert\n    const updatedUser = await usersRepository.findById(user.id);\n    expect(updatedUser?.name).toEqual('Jane Doe Updated');\n    // A nova senha deve ser diferente da antiga e não deve ser o texto plano\n    expect(updatedUser?.password_hash).not.toEqual('old_hashed_password');\n    expect(updatedUser?.password_hash).not.toEqual('new_password_123');\n  });\n\n  it('should throw an error if the user is not found', async () => {\n    // Act & Assert: Tenta atualizar um usuário com um ID que não existe e espera um erro\n    await expect(() => \n      sut.execute({\n        userId: 'non-existing-user-id',\n        name: 'Test',\n        email: 'test@example.com',\n      })\n    ).rejects.toThrow();\n  });\n});\n"},"src/services/purchase/fetch-all-purchase-by-user-id.test.ts":{"tests":[{"id":"217","name":"Fetch All Purchase by User Id Service should be able to fetch all purchases from a specific user"},{"id":"218","name":"Fetch All Purchase by User Id Service should throw an error if the user is not found"},{"id":"219","name":"Fetch All Purchase by User Id Service should return an empty array if the user has no purchases"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryPurchaseRepository } from '../../repositories/in-memory/in-memory-purchase-repository';\nimport { InMemoryUsersRepository } from '../../repositories/in-memory/in-memory-users-repository';\nimport { FetchAllPurchaseByUserIdService } from './fetch-all-purchase-by-user-id';\nimport { ResourceNotFoundError } from '../errors/resource-not-found-error';\n\n// Declaração das variáveis\nlet purchaseRepository: InMemoryPurchaseRepository;\nlet usersRepository: InMemoryUsersRepository;\nlet sut: FetchAllPurchaseByUserIdService; // SUT: System Under Test\n\ndescribe('Fetch All Purchase by User Id Service', () => {\n  beforeEach(() => {\n    // Instancia os repositórios e o serviço antes de cada teste\n    purchaseRepository = new InMemoryPurchaseRepository();\n    usersRepository = new InMemoryUsersRepository();\n    sut = new FetchAllPurchaseByUserIdService(purchaseRepository, usersRepository);\n  });\n\n  it('should be able to fetch all purchases from a specific user', async () => {\n    // Arrange: Cria dois usuários e compras para ambos\n    const user1 = await usersRepository.create({\n      id: 'user-01',\n      name: 'User One',\n      email: 'userone@example.com',\n      password_hash: 'hashed_password'\n    });\n\n    const user2 = await usersRepository.create({\n      id: 'user-02',\n      name: 'User Two',\n      email: 'usertwo@example.com',\n      password_hash: 'hashed_password'\n    });\n\n    await purchaseRepository.create({\n      nf_number: 'NF-001',\n      supplier: { connect: { id: 'supplier-01' } },\n      user: { connect: { id: user1.id } },\n    });\n\n    await purchaseRepository.create({\n      nf_number: 'NF-002',\n      supplier: { connect: { id: 'supplier-02' } },\n      user: { connect: { id: user1.id } },\n    });\n\n    await purchaseRepository.create({\n      nf_number: 'NF-003',\n      supplier: { connect: { id: 'supplier-01' } },\n      user: { connect: { id: user2.id } },\n    });\n\n    // Act: Executa o serviço buscando as compras do primeiro usuário\n    const { purchases } = await sut.execute({ userId: user1.id });\n\n    // Assert: Verifica se retornou apenas as compras do usuário correto\n    expect(purchases).toHaveLength(2);\n    expect(purchases[0].nf_number).toEqual('NF-001');\n    expect(purchases[1].nf_number).toEqual('NF-002');\n  });\n\n  it('should throw an error if the user is not found', async () => {\n    // Act & Assert: Tenta buscar compras de um usuário inexistente\n    await expect(() =>\n      sut.execute({ userId: 'non-existing-user-id' })\n    ).rejects.toBeInstanceOf(ResourceNotFoundError);\n  });\n\n  it('should return an empty array if the user has no purchases', async () => {\n    // Arrange: Cria um usuário mas nenhuma compra para ele\n    const user = await usersRepository.create({\n        id: 'user-no-purchases',\n        name: 'User No Purchases',\n        email: 'nouser@example.com',\n        password_hash: 'hashed_password'\n    });\n\n    // Act\n    const { purchases } = await sut.execute({ userId: user.id });\n\n    // Assert\n    expect(purchases).toHaveLength(0);\n  });\n});\n"},"src/services/product/reduce-product-stock.test.ts":{"tests":[{"id":"220","name":"Reduce Product Stock Service should be able to reduce the stock of a product"},{"id":"221","name":"Reduce Product Stock Service should throw an error if the product is not found"},{"id":"222","name":"Reduce Product Stock Service should throw an error if there is insufficient stock"},{"id":"223","name":"Reduce Product Stock Service should throw an error if product stock information is missing"}],"source":"import { beforeEach, describe, expect, it } from 'vitest';\nimport { InMemoryProductsRepository } from '../../repositories/in-memory/in-memory-products-repository';\nimport { ReduceProductStockService } from './reduce-product-stock';\nimport { ResourceNotFoundError } from '../errors/resource-not-found-error';\n\n// Declaração das variáveis\nlet productsRepository: InMemoryProductsRepository;\nlet sut: ReduceProductStockService; // SUT: System Under Test\n\ndescribe('Reduce Product Stock Service', () => {\n  beforeEach(() => {\n    // Instancia o repositório e o serviço antes de cada teste\n    productsRepository = new InMemoryProductsRepository();\n    sut = new ReduceProductStockService(productsRepository);\n  });\n\n  it('should be able to reduce the stock of a product', async () => {\n    // Arrange: Cria um produto com estoque inicial\n    const createdProduct = await productsRepository.create({\n      name: 'LED RGB',\n      description: 'Diodo emissor de luz',\n      price: 0.75,\n      quantity_in_stock: 100,\n      batch: 'L1'\n    });\n\n    // Act: Executa o serviço para reduzir o estoque\n    await sut.execute({ productId: createdProduct.id, quantity: 2
